<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AbouAmjad Store System | Suppliers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="app.css?v=live">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">
  <script src="config.js?v=live"></script>
  <script src="i18n.js?v=live"></script>
  <script src="ui.js?v=live"></script>
  <style>
    .sup-page .pp-stats{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;margin-bottom:1.15rem;}
    @media(min-width:700px){.sup-page .pp-stats{grid-template-columns:repeat(3,1fr);}}
    .sup-page .pp-stat{background:var(--tc-surface);border:1px solid var(--tc-border);border-radius:16px;padding:1rem 1.1rem;box-shadow:var(--tc-shadow);position:relative;overflow:hidden;}
    .sup-page .pp-stat::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--tc-accent);}
    .sup-page .pp-stat .k{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tc-muted);}
    .sup-page .pp-stat .v{font-size:1.75rem;font-weight:800;line-height:1.15;margin-top:.2rem;}
    .sup-page .pp-panel{background:var(--tc-surface);border:1px solid var(--tc-border);border-radius:18px;box-shadow:var(--tc-shadow);overflow:hidden;}
    .sup-page .pp-panel-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;padding:1rem 1.15rem;background:var(--tc-head-grad);border-bottom:1px solid var(--tc-border);}
    .sup-page .pp-panel-head h2{margin:0;font-size:.95rem;font-weight:800;display:flex;align-items:center;gap:.45rem;}
    .sup-page .pp-panel-head h2 i{color:var(--tc-accent);}
    .sup-page .pp-panel-body{padding:1.15rem;}
    .sup-page .pp-composer{display:grid;gap:.65rem;padding:1rem;border-radius:14px;background:var(--tc-accent-soft);border:1px dashed color-mix(in srgb,var(--tc-accent) 35%,transparent);margin-bottom:1rem;}
    @media(min-width:720px){.sup-page .pp-composer{grid-template-columns:1.4fr 1fr 1.2fr auto;align-items:end;}}
    .sup-page .pp-composer .tc-field{margin:0;}
    .sup-page .pp-item{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.9rem 1rem;border:1px solid var(--tc-border);border-radius:14px;background:var(--tc-surface);margin-bottom:.55rem;}
    .sup-page .pp-item:hover{border-color:color-mix(in srgb,var(--tc-accent) 30%,transparent);}
    .sup-page .pp-item .title{font-weight:800;font-size:.92rem;}
    .sup-page .pp-item .sub{font-size:.75rem;color:var(--tc-muted);margin-top:.2rem;}
    .sup-page .pp-ops{display:flex;gap:.35rem;}
    .sup-page .pp-ops .tc-btn{width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:10px;}
    .sup-page .pp-empty{text-align:center;padding:2rem 1rem;color:var(--tc-muted);}
  </style>
</head>
<body class="tc-page sup-page">
  <div class="tc-wrap">
    <div class="tc-shell">
      <div id="app-header"></div>

      <div class="pp-stats">
        <div class="pp-stat"><div class="k" data-i18n="suppliers">Suppliers</div><div class="v" id="kTotal">0</div></div>
        <div class="pp-stat"><div class="k" data-i18n="withPhone">With phone</div><div class="v" id="kPhone">0</div></div>
        <div class="pp-stat"><div class="k" data-i18n="linkedPeople">Linked people</div><div class="v" id="kLinked">0</div></div>
      </div>

      <section class="pp-panel">
        <div class="pp-panel-head">
          <h2><i class="bi bi-truck"></i> <span data-i18n="suppliers">Suppliers</span></h2>
          <button type="button" class="tc-btn" id="btnRefresh"><i class="bi bi-arrow-clockwise"></i> <span data-i18n="refresh">Refresh</span></button>
        </div>
        <div class="pp-panel-body">
          <div class="pp-composer" id="composer">
            <div class="tc-field">
              <label data-i18n="supplierName">Name</label>
              <input id="supName" class="tc-input w-100" data-i18n-placeholder="supplierNamePh" placeholder="Supplier name">
            </div>
            <div class="tc-field">
              <label data-i18n="phone">Phone</label>
              <input id="supPhone" class="tc-input w-100" placeholder="05…">
            </div>
            <div class="tc-field">
              <label data-i18n="note">Note</label>
              <input id="supNote" class="tc-input w-100" data-i18n-placeholder="supplierNotePh" placeholder="Optional note">
            </div>
            <button type="button" class="tc-btn tc-btn-primary" id="btnSave"><i class="bi bi-plus-lg"></i> <span id="saveLabel" data-i18n="addSupplier">Add</span></button>
          </div>
          <input type="hidden" id="editId" value="">
          <div class="d-flex gap-2 mb-3">
            <input id="q" class="tc-search" style="max-width:280px" data-i18n-placeholder="searchPlaceholder" placeholder="Search…">
            <button type="button" class="tc-btn" id="btnCancel" style="display:none"><span data-i18n="cancelEdit">Cancel edit</span></button>
          </div>
          <div id="list"></div>
        </div>
      </section>
    </div>
  </div>
  <script>
    let items = [];
    let linkedCounts = {};

    document.addEventListener("DOMContentLoaded", () => TCUI.bootPage(() => {
      TCUI.mountHeader("app-header", {
        active: "suppliers",
        titleKey: "suppliers",
        subtitleKey: "suppliersSub",
        icon: "bi-truck"
      });
      document.getElementById("btnRefresh").onclick = load;
      document.getElementById("btnSave").onclick = save;
      document.getElementById("btnCancel").onclick = resetForm;
      document.getElementById("q").oninput = render;
      load();
    }, { pageId: "suppliers" }));

    async function load() {
      try {
        const [sData, pData] = await Promise.all([
          apiGet({ action: "listSuppliers" }),
          apiGet({ action: "listPeople" })
        ]);
        if (sData && sData.error) throw new Error(sData.error);
        items = (sData && sData.items) || [];
        linkedCounts = {};
        ((pData && pData.items) || []).forEach((p) => {
          const id = p.supplierId || p.supplier_id;
          if (!id) return;
          linkedCounts[id] = (linkedCounts[id] || 0) + 1;
        });
        document.getElementById("kTotal").textContent = items.length;
        document.getElementById("kPhone").textContent = items.filter((s) => s.phone).length;
        document.getElementById("kLinked").textContent = Object.values(linkedCounts).reduce((a, b) => a + b, 0);
        render();
      } catch (e) {
        document.getElementById("list").innerHTML = `<div class="text-danger">${escHtml(e.message || "Error")}</div>`;
      }
    }

    function render() {
      const q = document.getElementById("q").value.trim().toUpperCase();
      const rows = items.filter((s) => {
        if (!q) return true;
        return [s.name, s.phone, s.note].join(" ").toUpperCase().includes(q);
      });
      const host = document.getElementById("list");
      if (!rows.length) {
        host.innerHTML = `<div class="pp-empty"><i class="bi bi-truck"></i>${t("noRows")}</div>`;
        return;
      }
      const canEdit = can("worker.create") || can("worker.edit") || can("tool.receive");
      const canDel = can("worker.delete") || can("tool.delete") || can("tool.edit");
      host.innerHTML = rows.map((s) => {
        const linked = linkedCounts[s.id] || 0;
        return `<div class="pp-item">
          <div>
            <div class="title">${escHtml(s.name)}</div>
            <div class="sub">
              ${s.phone ? `<i class="bi bi-telephone"></i> ${escHtml(s.phone)} · ` : ""}
              ${linked ? t("linkedPeopleN", { n: linked }) : t("noLinkedPeople")}
              ${s.note ? ` · ${escHtml(s.note)}` : ""}
            </div>
          </div>
          <div class="pp-ops">
            ${canEdit ? `<button type="button" class="tc-btn" title="${t("edit")}" onclick="editSupplier(${s.id})"><i class="bi bi-pencil"></i></button>` : ""}
            ${canDel ? `<button type="button" class="tc-btn tc-btn-danger" title="${t("delete")}" data-del-id="${s.id}" data-del-name="${escHtml(s.name)}"><i class="bi bi-trash"></i></button>` : ""}
          </div>
        </div>`;
      }).join("");
      host.querySelectorAll("[data-del-id]").forEach((btn) => {
        btn.onclick = () => removeSupplier(btn.getAttribute("data-del-id"), btn.getAttribute("data-del-name"));
      });
    }

    function resetForm() {
      document.getElementById("editId").value = "";
      document.getElementById("supName").value = "";
      document.getElementById("supPhone").value = "";
      document.getElementById("supNote").value = "";
      document.getElementById("btnCancel").style.display = "none";
      document.getElementById("saveLabel").textContent = t("addSupplier");
    }

    window.editSupplier = function (id) {
      const s = items.find((x) => Number(x.id) === Number(id));
      if (!s) return;
      document.getElementById("editId").value = String(s.id);
      document.getElementById("supName").value = s.name || "";
      document.getElementById("supPhone").value = s.phone || "";
      document.getElementById("supNote").value = s.note || "";
      document.getElementById("btnCancel").style.display = "";
      document.getElementById("saveLabel").textContent = t("save");
      document.getElementById("supName").focus();
    };

    async function save() {
      const name = document.getElementById("supName").value.trim();
      if (!name) return TCUI.toast(t("supplierNameRequired"), "err");
      const id = document.getElementById("editId").value;
      try {
        const res = await apiGet({
          action: "upsertSupplier",
          id: id || undefined,
          name,
          phone: document.getElementById("supPhone").value.trim(),
          note: document.getElementById("supNote").value.trim()
        });
        if (!res || res.success === false || res.error) {
          TCUI.toast((res && res.error) || "Failed", "err");
          return;
        }
        TCUI.toast(t("supplierSaved"), "ok");
        resetForm();
        load();
      } catch (e) {
        TCUI.toast(e.message || "Error", "err");
      }
    }

    window.removeSupplier = async function (id, name) {
      if (!confirm(t("deleteSupplierConfirm", { name: name || id }))) return;
      try {
        const res = await apiGet({ action: "deleteSupplier", id });
        if (!res || res.success === false || res.error) {
          TCUI.toast((res && (res.message || res.error)) || "Failed", "err");
          return;
        }
        TCUI.toast(t("supplierDeleted"), "ok");
        load();
      } catch (e) {
        TCUI.toast(e.message || "Error", "err");
      }
    };
  </script>
</body>
</html>
