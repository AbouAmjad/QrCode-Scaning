<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AbouAmjad Store System | Bulk add people</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=live">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">
  <script src="config.js?v=live"></script>
  <script src="i18n.js?v=live"></script>
  <script src="ui.js?v=live"></script>
  <style>
    .pb-page { font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    .pb-page .pb-wrap { max-width: 720px; margin: 0 auto; }
    .pb-page .pp-panel {
      background: var(--tc-surface); border: 1px solid var(--tc-border); border-radius: 18px;
      box-shadow: 0 14px 36px -24px rgba(20,32,51,.4); overflow: hidden;
    }
    .pb-page .pp-panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap;
      padding: 1rem 1.15rem; background: var(--tc-head-grad); border-bottom: 1px solid var(--tc-border);
    }
    .pb-page .pp-panel-head h2 {
      margin: 0; font-size: 1rem; font-weight: 800; display: flex; align-items: center; gap: .45rem;
    }
    .pb-page .pp-panel-head h2 i { color: var(--tc-accent); }
    .pb-page .pp-panel-body { padding: 1.25rem; }
    .pb-page .pb-note {
      padding: 1rem 1.05rem; border-radius: 14px; margin-bottom: 1rem;
      background: var(--tc-surface-2); border: 1px solid var(--tc-border);
      color: var(--tc-muted); font-size: .9rem; line-height: 1.5;
    }
  </style>
</head>
<body class="tc-page pb-page">
  <div class="tc-wrap">
    <div class="tc-shell">
      <div id="app-header"></div>
      <div class="pb-wrap">
        <section class="pp-panel">
          <div class="pp-panel-head">
            <h2><i class="bi bi-people"></i> <span data-i18n="bulkAddPeople">Bulk add people</span></h2>
            <a class="tc-btn" href="people.html"><i class="bi bi-arrow-left"></i> <span data-i18n="backToPeople">Back</span></a>
          </div>
          <div class="pp-panel-body">
            <div class="pb-note">
              Automatic Iqama / ID reading has been removed.
              Add people one by one with a photo from the person form.
            </div>
            <a class="tc-btn tc-btn-primary" href="people-form.html">
              <i class="bi bi-person-plus"></i> <span data-i18n="addPersonBtn">Add person</span>
            </a>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => TCUI.bootPage(async () => {
      TCUI.mountHeader("app-header", {
        active: "people",
        titleKey: "bulkAddPeople",
        subtitleKey: "peopleSub",
        icon: "bi-people",
        toolbar: `<a class="tc-btn" href="people.html"><i class="bi bi-arrow-left"></i> <span data-i18n="backToPeople">Back to people</span></a>`
      });
    }, { pageId: "people" }));
  </script>
</body>
</html>
