<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolCustody | Reports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a5f">
  <script src="config.js"></script>
  <script src="ui.js"></script>
  <script src="parser.js"></script>
</head>
<body class="tc-page">
  <div class="tc-wrap">
    <div class="tc-shell">
      <div id="app-header"></div>
      <div class="row g-4 mb-4">
        <div class="col-md-3"><div class="tc-kpi"><div class="label">Out now</div><div class="value" id="rOut">—</div></div></div>
        <div class="col-md-3"><div class="tc-kpi orange"><div class="label">Overdue</div><div class="value" id="rOver">—</div></div></div>
        <div class="col-md-3"><div class="tc-kpi green"><div class="label">Workers</div><div class="value" id="rWork">—</div></div></div>
        <div class="col-md-3"><div class="tc-kpi purple"><div class="label">Warnings</div><div class="value" id="rWarn">—</div></div></div>
      </div>
      <div class="tc-card mb-4">
        <span class="tc-section-badge"><i class="bi bi-file-earmark-bar-graph"></i> Report pack</span>
        <div class="d-flex flex-wrap gap-2 mt-3">
          <select id="dateSelect" class="tc-select" style="min-width:180px"></select>
          <button class="tc-btn tc-btn-primary" id="btnDaily"><i class="bi bi-download"></i> Daily CSV</button>
          <button class="tc-btn" id="btnLost"><i class="bi bi-exclamation"></i> Overdue / Lost CSV</button>
          <a class="tc-btn" href="damage.html">Damage cost (open module)</a>
          <a class="tc-btn" href="worker.html">Worker history</a>
          <a class="tc-btn" href="tool.html">Tool history</a>
        </div>
        <p class="tc-text-muted small mt-3 mb-0">Weekly/Monthly and Inventory Valuation expand as Receiving cost data accumulates.</p>
      </div>
      <div class="tc-card">
        <span class="tc-section-badge"><i class="bi bi-table"></i> Preview</span>
        <pre id="preview" class="mt-2 mb-0 small" style="white-space:pre-wrap;max-height:320px;overflow:auto"></pre>
      </div>
    </div>
  </div>
  <script>
    let lastOverview = null, activeDate = "";

    document.addEventListener("DOMContentLoaded", () => TCUI.bootPage(() => {
      TCUI.mountHeader("app-header", {
        active: "reports", title: "Reports",
        subtitle: "Daily · Overdue · Worker · Tool · Damage · Valuation (phased)",
        icon: "bi-file-earmark-bar-graph"
      });
      document.getElementById("btnDaily").onclick = () => exportCsv("daily");
      document.getElementById("btnLost").onclick = () => exportCsv("lost");
      init();
    }, { minRole: "supervisor" }));

    async function init() {
      const dates = await loadDateOptions(document.getElementById("dateSelect"));
      activeDate = dates[0] || "";
      document.getElementById("dateSelect").onchange = e => { activeDate = e.target.value; refresh(); };
      refresh();
    }

    async function refresh() {
      try {
        const rows = await apiGet({ action: "getData", date: activeDate });
        if (rows.error) throw new Error(rows.error);
        lastOverview = CustodyParser.parseDashboard(rows, activeDate);
        document.getElementById("rOut").textContent = lastOverview.totalOut;
        document.getElementById("rWork").textContent = lastOverview.totalWorkers;
        document.getElementById("rWarn").textContent = lastOverview.warnings;
        document.getElementById("rOver").textContent = lastOverview.overdueCount || 0;
        document.getElementById("preview").textContent = JSON.stringify({
          date: activeDate,
          out: lastOverview.totalOut,
          workers: lastOverview.totalWorkers,
          warnings: lastOverview.warnings,
          overdue: lastOverview.overdueCount
        }, null, 2);
      } catch (e) {
        document.getElementById("preview").textContent = e.message || "Error";
      }
    }

    function exportCsv(kind) {
      if (!lastOverview) return;
      let lines = ["code,description,person,takenOn,qty"];
      if (kind === "lost") {
        (lastOverview.overdue || []).forEach(t => {
          lines.push([t.code, JSON.stringify(t.desc || ""), JSON.stringify(t.person || ""), t.takenOn || "", t.qty || 1].join(","));
        });
      } else {
        lines = ["code,description,qty,holders"];
        (lastOverview.tools || []).forEach(t => {
          lines.push([t.code, JSON.stringify(t.description || ""), t.qty || 0, JSON.stringify((t.holderNames || []).join("|"))].join(","));
        });
      }
      const blob = new Blob([lines.join("\n")], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (kind === "lost" ? "overdue" : "daily") + "-" + (activeDate || "export") + ".csv";
      a.click();
    }
  </script>
</body>
</html>
