<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolCustody | Repair</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a5f">
  <script src="config.js"></script>
  <script src="ui.js"></script>
</head>
<body class="tc-page">
  <div class="tc-wrap">
    <div class="tc-shell">
      <div id="app-header"></div>
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="tc-card">
            <span class="tc-section-badge"><i class="bi bi-wrench"></i> Lifecycle change</span>
            <div class="tc-field mt-3"><label>Tool code</label><input id="code" class="form-control" placeholder="I1001"></div>
            <div class="tc-field"><label>State</label>
              <select id="state" class="tc-select w-100">
                <option>Active</option>
                <option>Under Repair</option>
                <option>Awaiting Parts</option>
                <option>Scrap</option>
                <option>Returned</option>
              </select>
            </div>
            <div class="tc-field"><label>Note</label><input id="note" class="form-control" placeholder="Vendor / parts…"></div>
            <button class="tc-btn tc-btn-primary w-100" id="btnSave"><i class="bi bi-check2"></i> Update state</button>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="tc-card">
            <span class="tc-section-badge"><i class="bi bi-list-ul"></i> Current states</span>
            <div class="table-responsive mt-2">
              <table class="table tc-table mb-0">
                <thead><tr><th>Code</th><th>State</th><th>Updated</th><th>Note</th></tr></thead>
                <tbody id="lifeBody"><tr><td colspan="4" class="tc-text-muted text-center">Loading…</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => TCUI.bootPage(() => {
      TCUI.mountHeader("app-header", {
        active: "repair", title: "Repair / Lifecycle",
        subtitle: "Active · Under Repair · Awaiting Parts · Scrap · Returned",
        icon: "bi-wrench"
      });
      loadList();
      document.getElementById("btnSave").onclick = saveState;
    }, { minRole: "supervisor" }));

    async function loadList() {
      const body = document.getElementById("lifeBody");
      try {
        const data = await apiGet({ action: "getLifecycle" });
        const items = (data && data.items) || [];
        if (!items.length) {
          body.innerHTML = `<tr><td colspan="4" class="tc-text-muted text-center">No lifecycle rows</td></tr>`;
          return;
        }
        body.innerHTML = items.map(i => `<tr>
          <td><strong>${escHtml(i.code)}</strong></td>
          <td>${escHtml(i.state)}</td>
          <td>${escHtml(i.updatedAt || "")}</td>
          <td>${escHtml(i.note || "")}</td>
        </tr>`).join("");
      } catch (e) {
        body.innerHTML = `<tr><td colspan="4" class="text-danger text-center">${escHtml(e.message || "Error")}</td></tr>`;
      }
    }

    async function saveState() {
      try {
        const res = await apiPostForm({
          action: "setLifecycle",
          code: document.getElementById("code").value.trim(),
          state: document.getElementById("state").value,
          note: document.getElementById("note").value.trim(),
          user: getSessionUser(),
          role: getRole()
        });
        if (res.error) { TCUI.toast(res.error, "err"); return; }
        TCUI.toast(res.code + " → " + res.state, "ok");
        loadList();
      } catch (e) {
        TCUI.toast(e.message || "Failed", "err");
      }
    }
  </script>
</body>
</html>
