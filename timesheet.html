<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolCustody | Timesheet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="timesheet/styles.css?v=1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a5f">
  <script src="config.js"></script>
  <script src="ui.js"></script>
</head>
<body class="tc-page ts-page">
  <div class="tc-wrap">
    <div class="tc-shell">
      <div id="app-header"></div>
      <div id="tsRoot">
        <p class="ts-muted">Loading Timesheet…</p>

        <section data-ts-panel="employee admin engineer" id="tsWorkerSection">
          <h2 class="h5 fw-bold mb-3"><i class="bi bi-person-workspace"></i> Worker</h2>
          <div id="tsWorkerPanel"></div>
        </section>

        <section data-ts-panel="engineer" id="tsEngineerSection" class="mt-4" hidden>
          <h2 class="h5 fw-bold mb-3"><i class="bi bi-clipboard-data"></i> Engineer</h2>
          <div id="tsEngineerPanel"></div>
        </section>

        <section data-ts-panel="engineer" id="tsReportsSection" class="mt-4" hidden>
          <div id="tsReportsPanel"></div>
        </section>

        <section data-ts-panel="admin" id="tsAdminSection" class="mt-4" hidden>
          <h2 class="h5 fw-bold mb-3"><i class="bi bi-shield-lock"></i> Admin</h2>
          <div id="tsAdminPanel"></div>
        </section>
      </div>
    </div>
  </div>
  <script type="module">
    import { bootTimesheet } from "./timesheet/app.js?v=1";
    document.addEventListener("DOMContentLoaded", () => {
      TCUI.bootPage(async () => {
        TCUI.mountHeader("app-header", {
          active: "timesheet",
          title: "Timesheet",
          subtitle: "Attendance · projects · reports (isolated module)",
          icon: "bi-clock-history"
        });
        await bootTimesheet();
      }, { pageId: "timesheet" });
    });
  </script>
</body>
</html>
