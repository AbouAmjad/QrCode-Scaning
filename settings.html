<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AbouAmjad Store System | Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="app.css?v=live">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">
  <script src="config.js?v=live"></script>
  <script src="i18n.js?v=live"></script>
  <script src="ui.js?v=live"></script>
  <style>
    .st-theme {
      display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; margin-top: .85rem;
    }
    .st-theme-btn {
      display: flex; flex-direction: column; align-items: flex-start; gap: .35rem;
      padding: .95rem 1rem; border-radius: 16px; border: 1px solid var(--tc-border);
      background: var(--tc-surface-2); color: var(--tc-text); cursor: pointer; text-align: start;
      min-height: 88px; transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .st-theme-btn i { font-size: 1.25rem; color: var(--tc-muted); }
    .st-theme-btn strong { font-size: .95rem; font-weight: 800; }
    .st-theme-btn small { color: var(--tc-muted); font-size: .75rem; }
    .st-theme-btn.active {
      border-color: color-mix(in srgb, var(--tc-accent) 55%, transparent);
      background: var(--tc-accent-soft); box-shadow: 0 10px 24px -18px rgba(15,118,110,.55);
    }
    .st-theme-btn.active i { color: var(--tc-accent-2); }
    .st-theme-btn:active { transform: scale(.985); }
    @media (max-width: 520px) {
      .st-theme { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="tc-page">
  <div class="tc-wrap narrow">
    <div class="tc-shell">
      <div id="app-header"></div>

      <div class="tc-card mb-3">
        <span class="tc-section-badge"><i class="bi bi-palette"></i> <span data-i18n="settingsAppearance">Appearance</span></span>
        <div class="st-theme" role="group" aria-label="Theme">
          <button type="button" class="st-theme-btn" data-theme="light" id="themeLight">
            <i class="bi bi-sun-fill"></i>
            <strong data-i18n="themeLight">Light</strong>
            <small>Bright workspace</small>
          </button>
          <button type="button" class="st-theme-btn" data-theme="dark" id="themeDark">
            <i class="bi bi-moon-stars-fill"></i>
            <strong data-i18n="themeDark">Dark</strong>
            <small>Low-glare night mode</small>
          </button>
        </div>
      </div>

      <div class="tc-card mb-3">
        <span class="tc-section-badge"><i class="bi bi-key"></i> <span data-i18n="profilePassword">Change password</span></span>
        <div class="tc-field mt-3">
          <label data-i18n="profileCurrentPass">Current password</label>
          <input type="password" id="curPass" class="tc-input w-100" autocomplete="current-password">
        </div>
        <div class="tc-field">
          <label data-i18n="profileNewPass">New password</label>
          <input type="password" id="newPass" class="tc-input w-100" autocomplete="new-password">
        </div>
        <div class="tc-field">
          <label data-i18n="regConfirmPass">Confirm password</label>
          <input type="password" id="newPass2" class="tc-input w-100" autocomplete="new-password">
        </div>
        <p class="tc-text-muted small" data-i18n="profilePassHint">Minimum 8 characters. Other sessions will be signed out.</p>
        <button type="button" class="tc-btn tc-btn-primary" id="btnChangePass">
          <i class="bi bi-shield-lock"></i> <span data-i18n="profileChangePass">Update password</span>
        </button>
      </div>

      <div class="tc-card mb-3" id="opsTerminal" hidden>
        <span class="tc-section-badge"><i class="bi bi-sliders"></i> <span data-i18n="settingsTerminal">Terminal</span></span>
        <div class="tc-field mt-3">
          <label data-i18n="autoDirectionMode">Auto direction mode</label>
          <select id="autoDirectionMode" class="tc-select w-100">
            <option value="manual" data-i18n="dirManual">Manual</option>
            <option value="last" data-i18n="dirRemember">Remember last IN/OUT</option>
          </select>
        </div>
        <div class="tc-field">
          <label data-i18n="validationMode">Validation</label>
          <select id="validationMode" class="tc-select w-100">
            <option value="strict" data-i18n="validationStrict">Strict</option>
            <option value="lenient" data-i18n="validationLenient">Lenient</option>
          </select>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="soundEnabled">
          <label class="form-check-label" for="soundEnabled" data-i18n="scanSounds">Scan sounds</label>
        </div>
        <div class="tc-field">
          <label data-i18n="soundVolume">Sound volume</label>
          <input id="soundVolume" type="range" min="0" max="1" step="0.05" class="form-range">
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="hotkeysEnabled">
          <label class="form-check-label" for="hotkeysEnabled" data-i18n="hotkeys">Hotkeys</label>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="autoHideWarning">
          <label class="form-check-label" for="autoHideWarning" data-i18n="autoHideWarning">Auto-hide scan warnings</label>
        </div>
      </div>

      <div class="tc-card mb-3" id="opsAlerts" hidden>
        <span class="tc-section-badge"><i class="bi bi-bell"></i> <span data-i18n="settingsAlerts">Alerts &amp; ops</span></span>
        <div class="tc-field mt-3">
          <label data-i18n="overdueDays">Overdue after (days)</label>
          <input id="overdueDays" type="number" min="1" max="90" class="tc-input w-100" value="1">
          <p class="tc-text-muted small mt-1 mb-0" data-i18n="overdueDaysHint">Used for notifications and outstanding hints</p>
        </div>
        <div class="tc-field">
          <label data-i18n="alertLevel">Alert sensitivity</label>
          <select id="alertLevel" class="tc-select w-100">
            <option value="quiet" data-i18n="alertQuiet">Quiet</option>
            <option value="standard" data-i18n="alertStandard">Standard</option>
            <option value="strict" data-i18n="alertStrict">Strict</option>
          </select>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="showLowStockAlerts">
          <label class="form-check-label" for="showLowStockAlerts" data-i18n="showLowStockAlerts">Show low-stock alerts</label>
        </div>
        <div class="tc-field">
          <label data-i18n="offlineQueueLimit">Offline queue limit</label>
          <input id="offlineQueueLimit" type="number" min="50" max="2000" class="tc-input w-100" value="300">
        </div>
      </div>

      <div class="tc-card mb-3" id="opsSystem" hidden>
        <span class="tc-section-badge"><i class="bi bi-link-45deg"></i> <span data-i18n="settingsSystem">System</span></span>
        <p class="mt-3 mb-1"><strong>API</strong>: <code id="apiUrl"></code></p>
        <p class="mb-1"><strong data-i18n="role">Role</strong>: <span id="roleInfo"></span></p>
        <p class="mb-0 tc-text-muted small" data-i18n="settingsLinksHint">User management → Users · Permission matrix → Roles · Audit → Audit log</p>
        <div class="d-flex flex-wrap gap-2 mt-3">
          <a class="tc-btn tc-btn-primary" href="users.html"><i class="bi bi-people"></i> <span data-i18n="users">Users</span></a>
          <a class="tc-btn tc-btn-primary" href="roles.html"><i class="bi bi-shield-lock"></i> <span data-i18n="roles">Roles</span></a>
          <a class="tc-btn tc-btn-primary" href="audit.html"><i class="bi bi-journal-text"></i> <span data-i18n="audit">Audit</span></a>
          <a class="tc-btn" href="profile.html"><i class="bi bi-person-circle"></i> <span data-i18n="profile">My profile</span></a>
          <a class="tc-btn" href="suppliers.html"><i class="bi bi-truck"></i> <span data-i18n="suppliers">Suppliers</span></a>
        </div>
      </div>

      <button type="button" class="tc-btn tc-btn-primary" id="btnSave" hidden>
        <i class="bi bi-check2"></i> <span data-i18n="saveSettings">Save settings</span>
      </button>
    </div>
  </div>
  <script>
    function setTheme(next) {
      const theme = next === "light" ? "light" : "dark";
      localStorage.setItem(AppConfig.THEME_KEY, theme);
      if (typeof applyTheme === "function") applyTheme();
      if (typeof syncThemeControls === "function") syncThemeControls();
      document.querySelectorAll(".st-theme-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.getAttribute("data-theme") === theme);
      });
    }

    async function changePassword() {
      const cur = document.getElementById("curPass").value;
      const neu = document.getElementById("newPass").value;
      const neu2 = document.getElementById("newPass2").value;
      if (!cur || !neu) return TCUI.toast(t("profilePassNeed"), "err");
      if (neu.length < 8) return TCUI.toast(t("PASSWORD_TOO_SHORT") || "Password must be at least 8 characters", "err");
      if (neu !== neu2) return TCUI.toast(t("regPassMismatch"), "err");

      const btn = document.getElementById("btnChangePass");
      btn.disabled = true;
      try {
        const res = await apiGet({
          action: "changeMyPassword",
          currentPassword: cur,
          newPassword: neu
        });
        if (!res || res.success === false || res.error) {
          const map = {
            CURRENT_PASSWORD_WRONG: t("profilePassWrong"),
            PASSWORD_TOO_SHORT: t("PASSWORD_TOO_SHORT") || "Password must be at least 8 characters",
            PASSWORD_UNCHANGED: t("profilePassSame")
          };
          TCUI.toast(map[res && res.error] || (res && res.error) || t("error"), "err");
          return;
        }
        if (res.token) setSession({ token: res.token });
        document.getElementById("curPass").value = "";
        document.getElementById("newPass").value = "";
        document.getElementById("newPass2").value = "";
        TCUI.toast(t("profilePassChanged"), "ok");
      } catch (e) {
        TCUI.toast(e.message || t("error"), "err");
      } finally {
        btn.disabled = false;
      }
    }

    document.addEventListener("DOMContentLoaded", () => TCUI.bootPage(() => {
      TCUI.mountHeader("app-header", {
        active: "settings",
        titleKey: "settings",
        subtitleKey: "settingsSub",
        icon: "bi-gear"
      });

      const canManage = typeof can === "function" && (
        can("settings.manage") || can("users.manage") || can("roles.manage") || getRole() === "admin"
      );

      setTheme(typeof getTheme === "function" ? getTheme() : "dark");
      document.querySelectorAll(".st-theme-btn").forEach((btn) => {
        btn.onclick = () => setTheme(btn.getAttribute("data-theme"));
      });
      document.getElementById("btnChangePass").onclick = changePassword;

      if (canManage) {
        document.getElementById("opsTerminal").hidden = false;
        document.getElementById("opsAlerts").hidden = false;
        document.getElementById("opsSystem").hidden = false;
        document.getElementById("btnSave").hidden = false;

        const s = getSettings();
        document.getElementById("autoDirectionMode").value = s.autoDirectionMode || "manual";
        document.getElementById("validationMode").value = s.validationMode || "strict";
        document.getElementById("soundEnabled").checked = !!s.soundEnabled;
        document.getElementById("soundVolume").value = s.soundVolume != null ? s.soundVolume : 0.9;
        document.getElementById("hotkeysEnabled").checked = !!s.hotkeysEnabled;
        document.getElementById("autoHideWarning").checked = !!s.autoHideWarning;
        document.getElementById("overdueDays").value = s.overdueDays || AppConfig.OVERDUE_DAYS || 1;
        document.getElementById("alertLevel").value = s.alertLevel || "standard";
        document.getElementById("showLowStockAlerts").checked = s.showLowStockAlerts !== false;
        document.getElementById("offlineQueueLimit").value = s.offlineQueueLimit || 300;
        document.getElementById("apiUrl").textContent = AppConfig.SCRIPT_URL;
        document.getElementById("roleInfo").textContent =
          (typeof TCI18N !== "undefined" ? TCI18N.roleLabelI18n(getRole()) : getRole()) +
          " · " + getPermissions().length + " permissions";
        document.getElementById("btnSave").onclick = () => {
          setSettings({
            autoDirectionMode: document.getElementById("autoDirectionMode").value,
            validationMode: document.getElementById("validationMode").value,
            soundEnabled: document.getElementById("soundEnabled").checked,
            soundVolume: Number(document.getElementById("soundVolume").value) || 0.9,
            hotkeysEnabled: document.getElementById("hotkeysEnabled").checked,
            autoHideWarning: document.getElementById("autoHideWarning").checked,
            overdueDays: Math.max(1, Number(document.getElementById("overdueDays").value) || 1),
            alertLevel: document.getElementById("alertLevel").value,
            showLowStockAlerts: document.getElementById("showLowStockAlerts").checked,
            offlineQueueLimit: Math.max(50, Number(document.getElementById("offlineQueueLimit").value) || 300)
          });
          TCUI.toast(t("settingsSaved"), "ok");
        };
      }
    }, { pageId: "settings" }));
  </script>
</body>
</html>
