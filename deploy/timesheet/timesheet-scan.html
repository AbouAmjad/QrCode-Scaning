<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AbouAmjad Store System | Attendance Scan</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="app.css?v=live">
  <link rel="stylesheet" href="timesheet.css?v=2">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">
  <script src="config.js?v=live"></script>
  <script src="i18n.js?v=live"></script>
  <script src="ui.js?v=live"></script>
</head>
<body class="tc-page ts-page" data-page="timesheetScan">
  <div class="tc-wrap"><div class="tc-shell">
    <div id="app-header"></div>
    <main class="tc-main p-3">
      <section class="ts-hero">
        <h1><i class="bi bi-qr-code-scan"></i> Attendance Scan</h1>
        <p>Choose the project once, then scan timesheet worker QR cards. Each scan marks that worker present for the day (fixed shift hours). Workers are managed in Timesheet Admin → Workers (separate from store People).</p>
      </section>

      <section class="ts-panel">
        <div class="ts-grid-2" style="margin-bottom:1rem">
          <div>
            <label class="ts-label" for="projectId">Project</label>
            <select id="projectId" class="ts-select"></select>
          </div>
          <div>
            <label class="ts-label" for="workDate">Date</label>
            <input type="date" id="workDate" class="ts-input">
          </div>
          <div>
            <label class="ts-label">Shift</label>
            <div id="shiftHint" style="font-weight:800;font-size:1.15rem;color:var(--tc-accent-2);padding-top:.55rem">— h</div>
          </div>
        </div>
        <label class="ts-label" for="scanInput">Scan worker QR / type code</label>
        <input id="scanInput" class="ts-input ts-scan-input" autocomplete="off" placeholder="Ready — scan worker card">
        <div id="banner" class="ts-banner"></div>
      </section>

      <section class="ts-panel">
        <h2><i class="bi bi-list-check"></i> Today’s punches</h2>
        <div class="table-responsive">
          <table class="ts-table">
            <thead><tr><th>Time</th><th>Code</th><th>Name</th><th>Project</th><th>Hours</th></tr></thead>
            <tbody id="todayBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div></div>
  <script>
    (async function () {
      if (typeof requireAuth === "function") requireAuth();
      if (typeof TCUI !== "undefined") TCUI.mountHeader({ pageId: "timesheetScan" });

      const projectSel = document.getElementById("projectId");
      const workDate = document.getElementById("workDate");
      const scanInput = document.getElementById("scanInput");
      const banner = document.getElementById("banner");
      const todayBody = document.getElementById("todayBody");
      workDate.value = new Date().toISOString().slice(0, 10);

      function showBanner(kind, text) {
        banner.className = "ts-banner show " + kind;
        banner.textContent = text;
      }

      async function loadMeta() {
        const settings = await apiGet({ action: "timesheetGetSettings" });
        document.getElementById("shiftHint").textContent = (settings.defaultShiftHours || 10) + " h";
        const projects = await apiGet({ action: "listProjects" });
        const items = projects.items || projects.rows || projects.projects || [];
        projectSel.innerHTML = '<option value="">Select project…</option>' +
          items.map((p) => `<option value="${p.id}">${p.name || p.code}</option>`).join("");
        const last = sessionStorage.getItem("ts_last_project");
        if (last) projectSel.value = last;
      }

      async function loadToday() {
        const res = await apiGet({ action: "timesheetListAttendance", from: workDate.value, to: workDate.value, status: "active" });
        const rows = res.rows || [];
        todayBody.innerHTML = rows.length
          ? rows.map((r) => `<tr>
              <td>${(r.punchedAt || "").slice(11, 19) || "—"}</td>
              <td><strong>${r.workerCode}</strong></td>
              <td>${r.workerName || ""}</td>
              <td>${r.projectName || ""}</td>
              <td>${r.baseHours}</td>
            </tr>`).join("")
          : '<tr><td colspan="5" class="ts-empty">No punches yet today</td></tr>';
      }

      async function punch(code) {
        const workerCode = String(code || "").trim().toUpperCase();
        if (!workerCode) return;
        if (!projectSel.value) {
          showBanner("err", "Select a project first");
          return;
        }
        sessionStorage.setItem("ts_last_project", projectSel.value);
        try {
          const res = await apiGet({
            action: "timesheetPunch",
            workerCode,
            projectId: projectSel.value,
            workDate: workDate.value,
          });
          if (res.error === "ALREADY_PUNCHED") {
            showBanner("warn", `${workerCode} already recorded today → ${res.projectName || "project"}`);
          } else if (res.error) {
            showBanner("err", res.error + (res.field ? " (" + res.field + ")" : ""));
          } else if (res.ok) {
            const a = res.attendance;
            showBanner("ok", `✓ ${a.workerName} (${a.workerCode}) · ${a.projectName} · +${a.baseHours}h`);
            await loadToday();
          } else {
            showBanner("err", JSON.stringify(res));
          }
        } catch (e) {
          showBanner("err", String(e.message || e));
        }
        scanInput.value = "";
        scanInput.focus();
      }

      scanInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); punch(scanInput.value); }
      });
      projectSel.addEventListener("change", () => scanInput.focus());
      workDate.addEventListener("change", loadToday);

      await loadMeta();
      await loadToday();
      scanInput.focus();
    })();
  </script>
</body>
</html>
