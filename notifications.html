<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolCustody | Notifications</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a5f">
  <script src="config.js"></script>
  <script src="ui.js"></script>
  <script src="parser.js"></script>
</head>
<body class="tc-page">
  <div class="tc-wrap">
    <div class="tc-shell">
      <div id="app-header"></div>
      <div class="tc-card">
        <span class="tc-section-badge"><i class="bi bi-bell"></i> Alerts center</span>
        <p class="tc-text-muted small mt-2">Overdue · Damage · Unsynced queue · System errors</p>
        <div id="list" class="mt-3">Loading…</div>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => TCUI.bootPage(() => {
      TCUI.mountHeader("app-header", {
        active: "notifications", title: "Notifications",
        subtitle: "Operational alerts",
        icon: "bi-bell"
      });
      loadAll();
    }, { minRole: "viewer" }));

    async function loadAll() {
      const host = document.getElementById("list");
      const items = [];
      try {
        const pending = (JSON.parse(localStorage.getItem("offlineScans") || "[]") || []).filter(s => !s.sent);
        if (pending.length) {
          items.push({ type: "queue", text: pending.length + " scan(s) waiting to sync", href: "index.html" });
        }
      } catch (_) {}

      try {
        const dates = await apiGet({ action: "getDates" });
        const day = Array.isArray(dates) && dates.length ? dates[dates.length - 1] : "";
        if (day) {
          const rows = await apiGet({ action: "getData", date: day });
          if (!rows.error) {
            const dash = CustodyParser.parseDashboard(rows, day);
            (dash.overdue || []).slice(0, 15).forEach(o => {
              items.push({
                type: "overdue",
                text: `${o.code} with ${o.person} since ${o.takenOn}`,
                href: "tool.html?code=" + encodeURIComponent(o.code)
              });
            });
            (dash.alerts || []).filter(a => a.type === "warn" || a.type === "error").slice(0, 10).forEach(a => {
              items.push({ type: a.type, text: a.text, href: "dashboard.html" });
            });
          }
        }
        const dmg = await apiGet({ action: "getDamage", date: "" });
        const ditems = (dmg && dmg.items) || [];
        ditems.slice(0, 8).forEach(d => {
          items.push({
            type: "damage",
            text: `Damage ${d.code || ""} · ${d.damagedBy || ""}`,
            href: "damage.html"
          });
        });
      } catch (e) {
        items.push({ type: "error", text: e.message || "Could not load alerts", href: "#" });
      }

      if (!items.length) {
        host.innerHTML = `<div class="tc-text-muted text-center py-4">All clear — no alerts</div>`;
        return;
      }
      host.innerHTML = items.map(i => `
        <a class="tc-card d-block mb-2 text-decoration-none" href="${i.href}" style="padding:0.85rem 1rem">
          <strong class="text-uppercase small">${escHtml(i.type)}</strong>
          <div>${escHtml(i.text)}</div>
        </a>`).join("");
    }
  </script>
</body>
</html>
