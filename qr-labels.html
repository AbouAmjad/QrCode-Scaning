<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolCustody | QR Labels</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a5f">
  <script src="config.js"></script>
  <script src="ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    @media print {
      .tc-topbar, .tc-page-head, .no-print { display: none !important; }
      .label-sheet { box-shadow: none !important; border: none !important; }
    }
    .label-sheet { display: flex; flex-wrap: wrap; gap: 1rem; }
    .qr-label {
      width: 180px; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 12px;
      text-align: center; background: #fff; color: #0f172a;
    }
    .qr-label canvas, .qr-label img { width: 140px; height: 140px; }
    .qr-label strong { display: block; margin-top: 0.35rem; font-size: 0.95rem; }
    .qr-label small { color: #64748b; }
  </style>
</head>
<body class="tc-page">
  <div class="tc-wrap">
    <div class="tc-shell">
      <div id="app-header"></div>
      <div class="tc-card no-print mb-4">
        <span class="tc-section-badge"><i class="bi bi-qr-code"></i> Generate labels</span>
        <div class="row g-3 mt-1 align-items-end">
          <div class="col-md-4"><label class="form-label">Codes (one per line)</label>
            <textarea id="codes" class="form-control" rows="5" placeholder="P001&#10;I1001&#10;OUT"></textarea>
          </div>
          <div class="col-md-4"><label class="form-label">Optional title under code</label>
            <input id="subtitle" class="form-control" placeholder="Abu Amjad Store">
          </div>
          <div class="col-md-4 d-flex gap-2">
            <button class="tc-btn tc-btn-primary" id="btnGen"><i class="bi bi-magic"></i> Generate</button>
            <button class="tc-btn" id="btnPrint"><i class="bi bi-printer"></i> Print</button>
          </div>
        </div>
      </div>
      <div id="labels" class="label-sheet"></div>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => TCUI.bootPage(() => {
      TCUI.mountHeader("app-header", {
        active: "labels", title: "QR / Barcode Labels",
        subtitle: "Generate and print stickers for Person · Direction · Tools",
        icon: "bi-qr-code"
      });
      document.getElementById("btnGen").onclick = generate;
      document.getElementById("btnPrint").onclick = () => window.print();
    }, { minRole: "store_keeper" }));

    async function generate() {
      const host = document.getElementById("labels");
      host.innerHTML = "";
      const lines = document.getElementById("codes").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const sub = document.getElementById("subtitle").value.trim();
      if (!lines.length) { TCUI.toast("Enter at least one code", "err"); return; }
      if (typeof QRCode === "undefined") { TCUI.toast("QR library failed to load", "err"); return; }
      for (const code of lines) {
        const card = document.createElement("div");
        card.className = "qr-label";
        const canvas = document.createElement("canvas");
        card.appendChild(canvas);
        const strong = document.createElement("strong");
        strong.textContent = code.toUpperCase();
        card.appendChild(strong);
        if (sub) {
          const small = document.createElement("small");
          small.textContent = sub;
          card.appendChild(small);
        }
        host.appendChild(card);
        await QRCode.toCanvas(canvas, code.toUpperCase(), { width: 140, margin: 1 });
      }
      if (typeof logAudit === "function") {
        logAudit("QR_LABELS", { count: lines.length, codes: lines.slice(0, 20) });
      }
      TCUI.toast("Generated " + lines.length + " labels", "ok");
    }
  </script>
</body>
</html>
