<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AbouAmjad Store System | Audit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=live">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">
  
  <script src="config.js?v=live"></script>
  <script src="i18n.js?v=live"></script>
  <script src="ui.js?v=live"></script>
</head>
<body class="tc-page">
  <div class="tc-wrap">
    <div class="tc-shell">
      <div id="app-header"></div>
      <div class="mb-2">
        <a class="tc-btn tc-btn-sm" href="settings.html"><i class="bi bi-arrow-left"></i> <span data-i18n="settings">Settings</span></a>
      </div>
      <div class="tc-card">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
          <span class="tc-section-badge"><i class="bi bi-journal-text"></i> Audit log</span>
          <button class="tc-btn" id="btnRefresh"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
        </div>
        <p class="tc-text-muted small">Who · When · Before/After · Device — last 200 events</p>
        <div class="table-responsive">
          <table class="table tc-table mb-0">
            <thead><tr><th>When</th><th>User</th><th>Role</th><th>Action</th><th>Detail</th><th>Device</th></tr></thead>
            <tbody id="auditBody"><tr><td colspan="6" class="tc-text-muted text-center">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => TCUI.bootPage(() => {
      TCUI.mountHeader("app-header", {
        active: "settings",
        titleKey: "audit",
        subtitleKey: "auditSub", 
        
        icon: "bi-journal-text"
      });
      document.getElementById("btnRefresh").onclick = loadAudit;
      loadAudit();
    }, { pageId: "audit" }));

    async function loadAudit() {
      const body = document.getElementById("auditBody");
      try {
        const data = await apiGet({ action: "getAuditLog" });
        const items = (data && data.items) || [];
        if (!items.length) {
          body.innerHTML = `<tr><td colspan="6" class="tc-text-muted text-center">${typeof t === "function" ? t("noRows") : "No rows"}</td></tr>`;
          return;
        }
        body.innerHTML = items.map(i => `<tr>
          <td>${escHtml(formatDisplayDateTime(i.timestamp || ""))}</td>
          <td>${escHtml(i.user || "")}</td>
          <td>${escHtml(i.role || "")}</td>
          <td><strong>${escHtml(i.action || "")}</strong></td>
          <td><small>${escHtml((i.detail || i.after || "").slice(0, 120))}</small></td>
          <td><small>${escHtml((i.device || "").slice(0, 40))}</small></td>
        </tr>`).join("");
      } catch (e) {
        body.innerHTML = `<tr><td colspan="6" class="text-danger text-center">${escHtml(e.message || "Error")}</td></tr>`;
      }
    }
  </script>
</body>
</html>
