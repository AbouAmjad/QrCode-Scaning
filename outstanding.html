<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AbouAmjad Store System | Not returned</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=navux1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">
  <script src="config.js?v=keeperfilter1"></script>
  <script src="i18n.js?v=navux1"></script>
  <script src="ui.js?v=navux1"></script>

  <style>
    .nr-page {
      font-family: "Plus Jakarta Sans", var(--tc-font);
      padding-bottom: calc(5.75rem + env(safe-area-inset-bottom, 0px));
    }
    @media (min-width: 900px) { .nr-page { padding-bottom: 1.5rem; } }

    .nr-page .nr-summary {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .65rem;
      margin-bottom: 1rem;
    }
    @media (min-width: 900px) { .nr-page .nr-summary { grid-template-columns: repeat(4, 1fr); gap: .75rem; } }
    .nr-page .nr-kpi {
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--tc-surface) 88%, var(--tc-accent) 12%), var(--tc-surface));
      border: 1px solid var(--tc-border);
      border-radius: 16px; padding: .85rem .95rem; position: relative; overflow: hidden;
      box-shadow: 0 12px 28px -24px rgba(0,0,0,.55);
      transition: transform .18s ease, border-color .18s ease;
    }
    .nr-page .nr-kpi:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--tc-accent) 35%, var(--tc-border)); }
    .nr-page .nr-kpi::before {
      content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--tc-accent);
    }
    .nr-page .nr-kpi.warn::before { background: var(--tc-warning); }
    .nr-page .nr-kpi.danger::before { background: var(--tc-danger); }
    .nr-page .nr-kpi.ok::before { background: var(--tc-success); }
    .nr-page .nr-kpi .k {
      font-size: .62rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
      color: var(--tc-muted);
    }
    .nr-page .nr-kpi .v {
      font-size: 1.55rem; font-weight: 800; line-height: 1.1; margin-top: .2rem;
      font-variant-numeric: tabular-nums; letter-spacing: -.02em;
    }
    .nr-page .nr-kpi .s { font-size: .72rem; color: var(--tc-muted); margin-top: .18rem; font-weight: 600; }

    .nr-page .nr-toolbar {
      background: var(--tc-surface);
      border: 1px solid var(--tc-border);
      border-radius: 18px;
      padding: .85rem;
      margin-bottom: .9rem;
      box-shadow: 0 14px 36px -28px rgba(0,0,0,.55);
    }
    .nr-page .nr-toolbar-top {
      display: flex; flex-wrap: wrap; gap: .55rem; align-items: center;
    }
    .nr-page .nr-search-row {
      display: flex; gap: .45rem; align-items: center; flex: 1; min-width: min(100%, 280px);
    }
    .nr-page .nr-search-row .tc-search {
      flex: 1; min-width: 0; max-width: none !important; border-radius: 12px;
      min-height: 44px; font-size: 16px;
    }
    .nr-page .nr-icon-btn {
      width: 44px; height: 44px; flex: 0 0 44px; border-radius: 12px; padding: 0;
      display: grid; place-items: center; border: 1px solid var(--tc-border);
      background: var(--tc-surface-2); color: var(--tc-text); position: relative;
    }
    .nr-page .nr-icon-btn.active {
      border-color: color-mix(in srgb, var(--tc-accent) 45%, transparent);
      background: var(--tc-accent-soft); color: var(--tc-accent-2);
    }
    .nr-page .nr-icon-btn .dot {
      position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%;
      background: var(--tc-accent); display: none;
    }
    .nr-page .nr-icon-btn.active .dot { display: block; }

    .nr-page .nr-seg {
      display: inline-flex; padding: .2rem; background: var(--tc-surface-2);
      border-radius: 12px; gap: .2rem; border: 1px solid var(--tc-border);
    }
    .nr-page .nr-seg button {
      border: 0; background: transparent; color: var(--tc-muted); font-weight: 800;
      font-size: .78rem; padding: .45rem .85rem; border-radius: 10px; cursor: pointer; min-height: 36px;
    }
    .nr-page .nr-seg button.active {
      background: var(--tc-surface); color: var(--tc-accent-2);
      box-shadow: 0 4px 12px -8px rgba(20,32,51,.35);
    }
    .nr-page .nr-toolbar-actions {
      display: flex; gap: .4rem; margin-inline-start: auto; flex-wrap: wrap;
    }
    .nr-page .nr-toolbar-actions .tc-btn { min-height: 40px; border-radius: 11px; font-weight: 800; }

    .nr-page .nr-filters {
      display: none; margin-top: .75rem; padding-top: .75rem;
      border-top: 1px solid var(--tc-border);
    }
    .nr-page .nr-filters.open { display: block; }
    .nr-page .nr-filters-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .65rem;
    }
    .nr-page .nr-field label {
      display: block; font-size: .65rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: .04em; color: var(--tc-muted); margin-bottom: .25rem;
    }
    .nr-page .nr-field input,
    .nr-page .nr-field select {
      width: 100%; min-height: 42px; border-radius: 11px; font-size: 15px;
    }
    .nr-page .nr-field-locked select { opacity: .85; cursor: not-allowed; }
    .nr-page .nr-scope-hint {
      margin: .35rem 0 0;
      font-size: .72rem;
      font-weight: 600;
      color: var(--tc-accent-2, var(--tc-muted));
      line-height: 1.35;
    }
    .nr-page .nr-filters-actions {
      display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; margin-top: .75rem;
    }
    .nr-page .nr-filters-actions .tc-btn { min-height: 42px; justify-content: center; }
    .nr-page .nr-active-chips {
      display: none; flex-wrap: wrap; gap: .35rem; margin-top: .65rem;
    }
    .nr-page .nr-active-chips.show { display: flex; }
    .nr-page .nr-active-chip {
      display: inline-flex; align-items: center; gap: .3rem;
      font-size: .72rem; font-weight: 800; padding: .28rem .55rem; border-radius: 999px;
      background: var(--tc-accent-soft); color: var(--tc-accent-2);
      border: 1px solid color-mix(in srgb, var(--tc-accent) 25%, transparent);
    }
    .nr-page .nr-active-chip button {
      border: 0; background: transparent; color: inherit; padding: 0; line-height: 1; cursor: pointer;
      display: grid; place-items: center;
    }

    @media (min-width: 900px) {
      .nr-page .nr-toolbar { padding: 1rem 1.1rem; }
      .nr-page .nr-filters { display: block !important; }
      .nr-page .nr-filters-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .nr-page .nr-filters-actions {
        display: flex; justify-content: flex-end; margin-top: .7rem;
      }
      .nr-page .nr-filters-actions #btnApplyFilters { display: none; }
      .nr-page .nr-filters-actions .tc-btn { min-width: 120px; }
      .nr-page .nr-icon-btn#btnToggleFilters { display: none; }
      .nr-page .nr-toolbar-actions #btnExportM,
      .nr-page .nr-toolbar-actions #btnRefreshM { display: none; }
    }
    @media (max-width: 899px) {
      .nr-page .nr-toolbar-actions #btnExport,
      .nr-page .nr-toolbar-actions #btnRefresh { display: none; }
    }

    .nr-page .nr-result-meta {
      display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap;
      margin: 0 0 .75rem; font-size: .78rem; color: var(--tc-muted); font-weight: 700;
    }

    .nr-page .nr-list { display: flex; flex-direction: column; gap: .85rem; }

    .nr-page .nr-card {
      border: 1px solid var(--tc-border); border-radius: 18px;
      background: var(--tc-surface); overflow: hidden;
      box-shadow: 0 14px 34px -26px rgba(0,0,0,.55);
      animation: nrIn .28s ease both;
    }
    .nr-page .nr-card:nth-child(2) { animation-delay: .03s; }
    .nr-page .nr-card:nth-child(3) { animation-delay: .06s; }
    .nr-page .nr-card:nth-child(4) { animation-delay: .09s; }
    .nr-page .nr-card:nth-child(5) { animation-delay: .12s; }
    @keyframes nrIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .nr-page .nr-card.overdue {
      border-color: color-mix(in srgb, var(--tc-danger) 42%, var(--tc-border));
      box-shadow: 0 14px 34px -24px color-mix(in srgb, var(--tc-danger) 45%, transparent);
    }
    .nr-page .nr-card-head {
      display: grid; grid-template-columns: auto 1fr auto; gap: .75rem; align-items: start;
      padding: 1rem 1rem .8rem; text-decoration: none; color: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .nr-page .nr-card-head:active { background: var(--tc-surface-2); }
    @media (min-width: 900px) {
      .nr-page .nr-card-head:hover { background: color-mix(in srgb, var(--tc-surface-2) 70%, transparent); }
    }
    .nr-page .nr-avatar {
      width: 52px; height: 52px; border-radius: 15px; object-fit: cover;
      background: var(--tc-thumb-bg); display: grid; place-items: center;
      color: var(--tc-muted); font-weight: 800; border: 1px solid var(--tc-border);
      font-size: 1rem; box-shadow: 0 8px 18px -14px rgba(0,0,0,.5);
    }
    .nr-page .nr-name { font-weight: 800; font-size: 1.05rem; line-height: 1.2; }
    .nr-page .nr-code {
      display: inline-flex; font-size: .68rem; font-weight: 800; color: var(--tc-accent-2);
      background: var(--tc-accent-soft); padding: .12rem .45rem; border-radius: 999px; margin-top: .28rem;
    }
    .nr-page .nr-status { display: flex; flex-direction: column; align-items: flex-end; gap: .3rem; }
    .nr-page .nr-badge {
      display: inline-flex; align-items: center; gap: .25rem;
      font-size: .7rem; font-weight: 800; padding: .35rem .55rem; border-radius: 999px;
      background: var(--tc-warn-bg); color: var(--tc-warning); white-space: nowrap;
    }
    .nr-page .nr-badge.hot { background: var(--tc-danger-bg); color: var(--tc-danger); }
    .nr-page .nr-qty-pill {
      font-size: .7rem; font-weight: 800; color: var(--tc-muted);
      font-variant-numeric: tabular-nums;
    }

    .nr-page .nr-info {
      display: grid; gap: .35rem; padding: 0 1rem .8rem;
      border-bottom: 1px solid var(--tc-border);
    }
    .nr-page .nr-info-row {
      display: flex; gap: .45rem; align-items: flex-start;
      font-size: .78rem; color: var(--tc-muted); line-height: 1.35;
    }
    .nr-page .nr-info-row i { margin-top: .12rem; flex-shrink: 0; opacity: .85; color: var(--tc-accent); }
    .nr-page .nr-info-row strong { color: var(--tc-text); font-weight: 700; }
    .nr-page .nr-info-row a { color: var(--tc-accent-2); font-weight: 700; text-decoration: none; }
    .nr-page .nr-info-row a:hover { text-decoration: underline; }

    .nr-page .nr-tools-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: .6rem 1rem .4rem; font-size: .68rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: .04em; color: var(--tc-muted);
    }
    .nr-page .nr-tools-body {
      padding: 0 .75rem .75rem; display: grid;
      grid-template-columns: 1fr; gap: .45rem;
    }
    @media (min-width: 1100px) {
      .nr-page .nr-tools-body.multi { grid-template-columns: 1fr 1fr; }
    }

    .nr-page .nr-tool {
      display: grid; grid-template-columns: 56px 1fr auto; gap: .4rem .6rem;
      align-items: start;
      padding: .7rem .75rem; border-radius: 14px;
      background: var(--tc-surface-2); border: 1px solid var(--tc-border);
      transition: border-color .15s ease, transform .15s ease;
    }
    .nr-page .nr-tool:hover {
      border-color: color-mix(in srgb, var(--tc-accent) 30%, var(--tc-border));
    }
    .nr-page .nr-tool .tc-product-thumb,
    .nr-page .nr-tool .tc-product-thumb.placeholder {
      width: 56px; height: 56px; border-radius: 12px; object-fit: cover; flex-shrink: 0;
    }
    .nr-page .nr-tool.hot {
      background: color-mix(in srgb, var(--tc-danger-bg) 70%, var(--tc-surface-2));
      border-color: color-mix(in srgb, var(--tc-danger) 28%, var(--tc-border));
    }
    .nr-page .nr-tool-code,
    .nr-page .nr-tool a.nr-tool-code {
      font-size: .72rem; font-weight: 800; color: var(--tc-accent-2);
      font-variant-numeric: tabular-nums; text-decoration: none;
    }
    .nr-page .nr-tool a.nr-tool-code:hover { text-decoration: underline; }
    .nr-page .nr-tool-name {
      font-size: .88rem; font-weight: 700; color: var(--tc-text); line-height: 1.25;
      margin-top: .1rem; word-break: break-word;
    }
    .nr-page .nr-tool-days {
      font-size: .72rem; font-weight: 800; padding: .3rem .55rem; border-radius: 999px;
      background: var(--tc-warn-bg); color: var(--tc-warning); align-self: start;
      white-space: nowrap;
    }
    .nr-page .nr-tool.hot .nr-tool-days { background: var(--tc-danger-bg); color: var(--tc-danger); }
    .nr-page .nr-tool-meta {
      grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .25rem .65rem;
      font-size: .72rem; color: var(--tc-muted); margin-top: .05rem;
    }
    .nr-page .nr-tool-meta span { display: inline-flex; align-items: center; gap: .22rem; }
    .nr-page .nr-tool-lots { display: grid; gap: .22rem; width: 100%; }
    .nr-page .nr-tool-lot {
      display: flex; align-items: center; gap: .35rem; flex-wrap: wrap;
      padding: .22rem .45rem; border-radius: 8px;
      background: var(--tc-surface); border: 1px solid var(--tc-border);
      color: var(--tc-text);
    }
    .nr-page .nr-tool-lot.hot {
      border-color: color-mix(in srgb, var(--tc-danger) 35%, transparent);
      background: var(--tc-danger-bg);
    }
    .nr-page .nr-tool-lot i { color: var(--tc-accent); }

    .nr-page .nr-card-foot {
      display: flex; justify-content: space-between; align-items: center; gap: .5rem;
      padding: .65rem 1rem .85rem; border-top: 1px solid var(--tc-border);
      background: color-mix(in srgb, var(--tc-surface-2) 55%, transparent);
    }
    .nr-page .nr-card-foot .tc-btn {
      min-height: 40px; border-radius: 11px; font-weight: 800; font-size: .8rem;
    }
    .nr-page .nr-card-foot .hint {
      font-size: .72rem; color: var(--tc-muted); font-weight: 600;
    }

    .nr-page .nr-empty {
      text-align: center; padding: 2.4rem 1rem; border: 1px dashed var(--tc-border);
      border-radius: 18px; background: var(--tc-surface);
    }
    .nr-page .nr-empty i { font-size: 2.1rem; color: var(--tc-success); display: block; margin-bottom: .45rem; }

    .nr-page .nr-dock-mobile {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      padding: .6rem .85rem calc(.6rem + env(safe-area-inset-bottom, 0px));
      background: color-mix(in srgb, var(--tc-surface) 92%, transparent);
      border-top: 1px solid var(--tc-border);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      display: grid; grid-template-columns: 1fr 1fr; gap: .45rem;
    }
    .nr-page .nr-dock-mobile .tc-btn {
      min-height: 46px; justify-content: center; border-radius: 12px; font-weight: 800;
    }
    @media (min-width: 900px) { .nr-page .nr-dock-mobile { display: none; } }

    .nr-page .nr-group { margin-bottom: 1.15rem; }
    .nr-page .nr-group-head {
      display: flex; align-items: center; justify-content: space-between; gap: .5rem;
      margin: 0 0 .6rem; padding: .2rem 0 .4rem;
      border-bottom: 1px solid var(--tc-border);
    }
    .nr-page .nr-group-head strong {
      font-size: .9rem; font-weight: 800; display: inline-flex; align-items: center; gap: .4rem;
    }
    .nr-page .nr-group-head strong i { color: var(--tc-accent); }
    .nr-page .nr-group-badge {
      font-size: .7rem; font-weight: 800; padding: .22rem .55rem; border-radius: 999px;
      background: var(--tc-accent-soft); color: var(--tc-accent-2);
    }
    .nr-page .nr-updated { font-size: .72rem; color: var(--tc-muted); font-weight: 600; }
    .nr-page .nr-chip-row { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .4rem; }
    .nr-page .nr-chip {
      font-size: .66rem; font-weight: 800; padding: .18rem .45rem; border-radius: 999px;
      background: var(--tc-surface-2); color: var(--tc-muted);
    }
    .nr-page .nr-chip.sup { background: color-mix(in srgb, var(--tc-accent) 18%, transparent); color: var(--tc-accent-2); }
    .nr-page .nr-chip.sv { background: color-mix(in srgb, #0284c7 18%, transparent); color: #38bdf8; }
    .nr-page .nr-chip.keeper { background: color-mix(in srgb, var(--tc-warning) 18%, transparent); color: var(--tc-warning); }
  </style>

</head>
<body class="tc-page nr-page">
  <div class="tc-wrap">
    <div class="tc-shell">
      <div id="app-header"></div>

      <div class="nr-summary" aria-label="Summary">
        <div class="nr-kpi">
          <div class="k" data-i18n="peopleWithTools">People</div>
          <div class="v" id="kPeople">0</div>
          <div class="s" data-i18n="nrWithOpenCustody">With open custody</div>
        </div>
        <div class="nr-kpi danger">
          <div class="k" data-i18n="toolsOut">Tools out</div>
          <div class="v" id="kTools">0</div>
          <div class="s" data-i18n="nrStillNotReturned">Still not returned</div>
        </div>
        <div class="nr-kpi warn">
          <div class="k" data-i18n="overduePeople">Overdue</div>
          <div class="v" id="kOverdue">0</div>
          <div class="s" data-i18n="nrPastDueThreshold">Past due threshold</div>
        </div>
        <div class="nr-kpi ok">
          <div class="k" data-i18n="oldestDays">Oldest (days)</div>
          <div class="v" id="kMax">0</div>
          <div class="s" data-i18n="nrLongestHold">Longest hold</div>
        </div>
      </div>

      <div class="nr-toolbar" id="nrToolbar">
        <div class="nr-toolbar-top">
          <div class="nr-search-row">
            <input id="q" class="tc-search" data-i18n-placeholder="searchPersonOrTool" placeholder="Search person or tool…">
            <button type="button" class="nr-icon-btn" id="btnToggleFilters" aria-expanded="false" title="Filters">
              <i class="bi bi-sliders"></i><span class="dot"></span>
            </button>
          </div>
          <div class="nr-seg" id="filterSeg">
            <button type="button" class="active" data-filter="all" data-i18n="all">All</button>
            <button type="button" data-filter="overdue" data-i18n="overdueOnly">Overdue only</button>
          </div>
          <div class="nr-toolbar-actions">
            <button type="button" class="tc-btn" id="btnExport" disabled><i class="bi bi-download"></i> <span data-i18n="export">Export</span></button>
            <button type="button" class="tc-btn tc-btn-primary" id="btnRefresh"><i class="bi bi-arrow-clockwise"></i> <span data-i18n="refresh">Refresh</span></button>
          </div>
        </div>

        <div class="nr-filters open" id="filtersPanel">
          <div class="nr-filters-grid">
            <div class="nr-field">
              <label data-i18n="storeKeeper">Store keeper</label>
              <select id="filterKeeper" class="tc-select">
                <option value="">All store keepers</option>
              </select>
            </div>
            <div class="nr-field">
              <label data-i18n="supplier">Supplier</label>
              <select id="filterSupplier" class="tc-select">
                <option value="">All suppliers</option>
              </select>
            </div>
            <div class="nr-field">
              <label data-i18n="supervisor">Supervisor</label>
              <select id="filterSupervisor" class="tc-select">
                <option value="">All supervisors</option>
              </select>
            </div>
            <div class="nr-field">
              <label data-i18n="minDaysOut">Min days out</label>
              <select id="minDays" class="tc-select">
                <option value="0">Any</option>
                <option value="1">1+</option>
                <option value="2">2+</option>
                <option value="3">3+</option>
                <option value="7">7+</option>
                <option value="14">14+</option>
                <option value="30">30+</option>
              </select>
            </div>
            <div class="nr-field">
              <label data-i18n="dateFrom">From</label>
              <input type="date" id="dateFrom" class="tc-input">
            </div>
            <div class="nr-field">
              <label data-i18n="dateTo">To</label>
              <input type="date" id="dateTo" class="tc-input">
            </div>
            <div class="nr-field">
              <label data-i18n="groupBy">Group by</label>
              <select id="groupBy" class="tc-select">
                <option value="none">None</option>
                <option value="keeper">Store keeper</option>
                <option value="supplier">Supplier</option>
                <option value="supervisor">Supervisor</option>
              </select>
            </div>
            <div class="nr-field">
              <label data-i18n="sortByDays">Sort</label>
              <select id="sortBy" class="tc-select">
                <option value="days" data-i18n="sortByDays">Longest out</option>
                <option value="qty" data-i18n="sortByQty">Most tools</option>
                <option value="name" data-i18n="sortByName">Name</option>
                <option value="time" data-i18n="sortByTime">Latest OUT time</option>
              </select>
            </div>
          </div>
          <div class="nr-filters-actions">
            <button type="button" class="tc-btn" id="btnClearDates"><i class="bi bi-x-lg"></i> <span data-i18n="clearDates">Clear filters</span></button>
            <button type="button" class="tc-btn tc-btn-primary" id="btnApplyFilters"><i class="bi bi-check2"></i> <span data-i18n="done">Done</span></button>
          </div>
          <div class="nr-active-chips" id="activeChips"></div>
        </div>
      </div>

      <div class="nr-result-meta">
        <span id="resultCount">—</span>
        <span><span id="overdueHint"></span> · <span class="nr-updated" id="lastUpdated"></span></span>
      </div>

      <div id="list" class="nr-list"></div>
    </div>
  </div>

  <div class="nr-dock-mobile" id="dockMobile">
    <button type="button" class="tc-btn" id="btnExportM" disabled><i class="bi bi-download"></i> <span data-i18n="export">Export</span></button>
    <button type="button" class="tc-btn tc-btn-primary" id="btnRefreshM"><i class="bi bi-arrow-clockwise"></i> <span data-i18n="refresh">Refresh</span></button>
  </div>

  <div class="tc-modal-backdrop" id="exportModal">
    <div class="tc-modal" style="max-width:420px">
      <div class="tc-modal-head">
        <div>
          <h3 class="h5 mb-1" data-i18n="exportNotReturned">Export not returned</h3>
          <p class="tc-text-muted small mb-0" id="exportModalHint" data-i18n="chooseExportFormat">Choose Excel or PDF</p>
        </div>
        <button type="button" class="tc-btn tc-btn-sm" id="btnCloseExport"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="tc-modal-body d-grid gap-2">
        <button type="button" class="tc-btn tc-btn-primary" id="btnExportXlsx" style="min-height:48px"><i class="bi bi-file-earmark-spreadsheet"></i> <span data-i18n="exportExcel">Excel (.xlsx)</span></button>
        <button type="button" class="tc-btn" id="btnExportPdf" style="min-height:48px"><i class="bi bi-file-earmark-pdf"></i> <span data-i18n="exportPdf">PDF</span></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="export-utils.js?v=keeper3"></script>
  <script>
    let items = [];
    let filterMode = "all";
    let overdueDaysSetting = 1;
    let autoTimer = null;
    const AUTO_MS = 30000;
    /** username -> display label from DB users */
    const keeperLabels = Object.create(null);
    /** usernames loaded from DB (listUsers) */
    const dbKeepers = new Set();
    /**
     * Legacy scan usernames → current username (only used when the target
     * is itself a listed store keeper).
     */
    const KEEPER_ALIASES = {};
    /** Roles that operate warehouse checkout (used for self-scope). Admin is NOT included. */
    const STORE_KEEPER_ROLES = new Set(["employee", "store_manager", "material_controller"]);
    /**
     * Admin “Store keeper” filter — classic Store Keeper only.
     * Source of truth: AppConfig.STORE_KEEPER_FILTER_ROLES (must stay employee-only).
     */
    const FILTER_KEEPER_ROLES = new Set(
      (typeof AppConfig !== "undefined" && Array.isArray(AppConfig.STORE_KEEPER_FILTER_ROLES) && AppConfig.STORE_KEEPER_FILTER_ROLES.length)
        ? AppConfig.STORE_KEEPER_FILTER_ROLES.map((r) => String(r).toLowerCase())
        : [(typeof AppConfig !== "undefined" && AppConfig.STORE_KEEPER_ROLE) || "employee"]
    );
    const userRoles = Object.create(null);
    /** Server-enforced scope: { mode: "self"|"all", keeper: "" } */
    let listScope = { mode: "all", keeper: "" };

    function canSeeAllKeepers() {
      if (typeof getRole === "function" && getRole() === "admin") return true;
      if (typeof can === "function") {
        if (can("inventory.view") || can("users.manage") || can("roles.manage") || can("dashboard.full")) return true;
      }
      return false;
    }

    function isSelfScoped() {
      return listScope.mode === "self" || (!canSeeAllKeepers() && STORE_KEEPER_ROLES.has(typeof getRole === "function" ? getRole() : ""));
    }

    function myUsername() {
      return typeof getSessionUser === "function" ? String(getSessionUser() || "").trim() : "";
    }

    function canonicalKeeper(username) {
      const u = String(username || "").trim();
      if (!u) return "";
      const mapped = KEEPER_ALIASES[u.toLowerCase()];
      if (mapped && (dbKeepers.has(mapped) || keeperLabels[mapped])) return mapped;
      return u;
    }

    function keeperMatchSet(selected) {
      const canon = canonicalKeeper(selected);
      if (!canon) return null;
      const set = new Set([canon, selected]);
      Object.keys(KEEPER_ALIASES).forEach((alias) => {
        if (KEEPER_ALIASES[alias] === canon) set.add(alias);
      });
      return set;
    }

    function formatKeeperLabel(username, fullName) {
      const name = String(fullName || "").trim();
      if (name) return name;
      return String(username || "").trim();
    }

    function tt(key, fallback) {
      try {
        if (typeof t === "function") {
          const v = t(key);
          if (v && v !== key) return v;
        }
      } catch (_) {}
      return fallback || key;
    }

    document.addEventListener("DOMContentLoaded", () => TCUI.bootPage(() => {
      const seeAll = canSeeAllKeepers();
      TCUI.mountHeader("app-header", {
        active: "outstanding",
        titleKey: "outstanding",
        subtitleKey: seeAll ? "outstandingAdminSub" : "outstandingKeeperSub",
        icon: "bi-person-exclamation"
      });
      applyKeeperScopeUi();
      const refresh = () => load();
      const openExp = () => openExportModal();
      document.getElementById("btnRefresh").onclick = refresh;
      document.getElementById("btnRefreshM").onclick = refresh;
      document.getElementById("btnExport").onclick = openExp;
      document.getElementById("btnExportM").onclick = openExp;
      document.getElementById("btnCloseExport").onclick = closeExportModal;
      document.getElementById("btnExportXlsx").onclick = () => doExport("xlsx");
      document.getElementById("btnExportPdf").onclick = () => doExport("pdf");
      document.getElementById("exportModal").addEventListener("click", (e) => {
        if (e.target.id === "exportModal") closeExportModal();
      });
      document.getElementById("q").oninput = render;
      document.getElementById("sortBy").onchange = render;
      document.getElementById("filterKeeper").onchange = () => { syncFilterDot(); render(); };
      document.getElementById("filterSupplier").onchange = () => { syncFilterDot(); render(); };
      document.getElementById("filterSupervisor").onchange = () => { syncFilterDot(); render(); };
      document.getElementById("minDays").onchange = () => { syncFilterDot(); render(); };
      document.getElementById("groupBy").onchange = render;
      document.getElementById("dateFrom").onchange = () => { syncFilterDot(); render(); };
      document.getElementById("dateTo").onchange = () => { syncFilterDot(); render(); };
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stopAuto();
        else startAuto();
      });
      startAuto();
      document.getElementById("btnClearDates").onclick = () => {
        document.getElementById("dateFrom").value = "";
        document.getElementById("dateTo").value = "";
        if (!isSelfScoped()) document.getElementById("filterKeeper").value = "";
        document.getElementById("filterSupplier").value = "";
        document.getElementById("filterSupervisor").value = "";
        document.getElementById("minDays").value = "0";
        document.getElementById("groupBy").value = "none";
        syncFilterDot();
        render();
      };
      document.getElementById("btnApplyFilters").onclick = () => {
        document.getElementById("filtersPanel").classList.remove("open");
        document.getElementById("btnToggleFilters").classList.remove("active");
        document.getElementById("btnToggleFilters").setAttribute("aria-expanded", "false");
        syncFilterDot();
        render();
      };
      document.getElementById("btnToggleFilters").onclick = () => {
        const panel = document.getElementById("filtersPanel");
        const btn = document.getElementById("btnToggleFilters");
        const open = !panel.classList.contains("open");
        panel.classList.toggle("open", open);
        btn.classList.toggle("active", open);
        btn.setAttribute("aria-expanded", open ? "true" : "false");
      };
      document.querySelectorAll("#filterSeg button").forEach((btn) => {
        btn.onclick = () => {
          filterMode = btn.getAttribute("data-filter") || "all";
          document.querySelectorAll("#filterSeg button").forEach((b) => b.classList.toggle("active", b === btn));
          render();
        };
      });
      if (!window.matchMedia("(min-width: 900px)").matches) {
        document.getElementById("filtersPanel").classList.remove("open");
      }
      load();
    }, { pageId: "outstanding" }));

    function startAuto() {
      stopAuto();
      autoTimer = setInterval(() => load({ silent: true }), AUTO_MS);
    }
    function stopAuto() {
      if (autoTimer) clearInterval(autoTimer);
      autoTimer = null;
    }

    function syncFilterDot() {
      const datesOn = !!(document.getElementById("dateFrom").value || document.getElementById("dateTo").value);
      const extraOn = !!(
        document.getElementById("filterKeeper").value ||
        document.getElementById("filterSupplier").value ||
        document.getElementById("filterSupervisor").value ||
        Number(document.getElementById("minDays").value || 0)
      );
      const filtersOn = datesOn || extraOn;
      const open = document.getElementById("filtersPanel").classList.contains("open");
      const btn = document.getElementById("btnToggleFilters");
      btn.classList.toggle("active", open || filtersOn);
      btn.querySelector(".dot").style.display = filtersOn ? "block" : "none";
    }

    function fillSelect(id, values, allLabel) {
      const el = document.getElementById(id);
      if (!el) return;
      const prev = el.value;
      const opts = [`<option value="">${escHtml(allLabel)}</option>`]
        .concat([...values].sort((a, b) => a.localeCompare(b)).map((v) =>
          `<option value="${escHtml(v)}">${escHtml(v)}</option>`
        ));
      el.innerHTML = opts.join("");
      if (prev && values.has(prev)) el.value = prev;
    }

    function applyKeeperScopeUi() {
      const el = document.getElementById("filterKeeper");
      const field = el && el.closest(".nr-field");
      if (!el) return;
      if (isSelfScoped()) {
        const me = listScope.keeper || myUsername();
        if (me) {
          el.innerHTML = `<option value="${escHtml(me)}">${escHtml(keeperLabels[me] || me)}</option>`;
          el.value = me;
        }
        el.disabled = true;
        if (field) field.classList.add("nr-field-locked");
        let hint = document.getElementById("keeperScopeHint");
        if (!hint && field) {
          hint = document.createElement("p");
          hint.id = "keeperScopeHint";
          hint.className = "nr-scope-hint";
          field.appendChild(hint);
        }
        if (hint) hint.textContent = tt("outstandingKeeperScope", "Showing your checkouts only");
      } else {
        el.disabled = false;
        if (field) field.classList.remove("nr-field-locked");
        const hint = document.getElementById("keeperScopeHint");
        if (hint) hint.remove();
      }
    }

    function fillKeeperSelect(values) {
      const el = document.getElementById("filterKeeper");
      if (!el) return;
      if (isSelfScoped()) {
        applyKeeperScopeUi();
        return;
      }
      const prev = el.value;
      const sorted = [...values].sort((a, b) => {
        const la = (keeperLabels[a] || a).toLowerCase();
        const lb = (keeperLabels[b] || b).toLowerCase();
        return la.localeCompare(lb);
      });
      const opts = [`<option value="">${escHtml(tt("allStoreKeepers", "All store keepers"))}</option>`]
        .concat(sorted.map((u) => {
          const label = keeperLabels[u] || u;
          return `<option value="${escHtml(u)}">${escHtml(label)}</option>`;
        }));
      el.innerHTML = opts.join("");
      if (prev && values.has(prev)) el.value = prev;
    }

    async function loadKeeperDirectory() {
      // Always wipe first so a failed/partial reload cannot keep demoted keepers.
      dbKeepers.clear();
      Object.keys(userRoles).forEach((k) => { delete userRoles[k]; });
      Object.keys(keeperLabels).forEach((k) => { delete keeperLabels[k]; });
      try {
        const data = await apiGet({ action: "listUsers" });
        if (!data || data.error) return;
        (data.items || []).forEach((u) => {
          if (!u || !u.username) return;
          if (u.active === false) return;
          if ((u.approvalStatus || "approved") !== "approved") return;
          const username = String(u.username);
          const role = String(u.role || "").trim().toLowerCase();
          userRoles[username] = role;
          // Current classic Store Keeper role only — never historical scan.created_by.
          if (!FILTER_KEEPER_ROLES.has(role)) return;
          dbKeepers.add(username);
          keeperLabels[username] = formatKeeperLabel(username, u.fullName);
        });
      } catch (_) {
        /* No scan-history fallback: empty filter is safer than stale former keepers. */
      }
    }

    function refreshFilterOptions() {
      const suppliers = new Set();
      const supervisors = new Set();
      // Picker = current FILTER_KEEPER_ROLES users only. Never merge outstanding lot keepers.
      const keepers = new Set([...dbKeepers]);
      items.forEach((p) => {
        if (p.supplierName) suppliers.add(String(p.supplierName));
        if (p.supervisorName) supervisors.add(String(p.supervisorName));
      });
      ["damage-auto", "system", "auto"].forEach((x) => keepers.delete(x));
      const el = document.getElementById("filterKeeper");
      if (el && el.value && !keepers.has(el.value) && !isSelfScoped()) el.value = "";
      fillKeeperSelect(keepers);
      fillSelect("filterSupplier", suppliers, tt("allSuppliers", "All suppliers"));
      fillSelect("filterSupervisor", supervisors, tt("allSupervisors", "All supervisors"));
    }


    function renderActiveChips() {
      const host = document.getElementById("activeChips");
      if (!host) return;
      const chips = [];
      const push = (id, label, clear) => {
        chips.push(`<span class="nr-active-chip">${escHtml(label)} <button type="button" data-clear="${id}" aria-label="Remove"><i class="bi bi-x"></i></button></span>`);
      };
      const keeper = document.getElementById("filterKeeper").value;
      const supplier = document.getElementById("filterSupplier").value;
      const supervisor = document.getElementById("filterSupervisor").value;
      const minDays = document.getElementById("minDays").value;
      const from = document.getElementById("dateFrom").value;
      const to = document.getElementById("dateTo").value;
      const groupBy = document.getElementById("groupBy").value;
      if (filterMode === "overdue") push("overdue", tt("overdueOnly", "Overdue only"));
      if (keeper) push("keeper", tt("storeKeeper", "Keeper") + ": " + (keeperLabels[keeper] || keeper));
      if (supplier) push("supplier", tt("supplier", "Supplier") + ": " + supplier);
      if (supervisor) push("supervisor", tt("supervisor", "Supervisor") + ": " + supervisor);
      if (Number(minDays) > 0) push("minDays", tt("minDaysOut", "Min days") + ": " + minDays + "+");
      if (from) push("from", tt("dateFrom", "From") + ": " + from);
      if (to) push("to", tt("dateTo", "To") + ": " + to);
      if (groupBy && groupBy !== "none") push("groupBy", tt("groupBy", "Group") + ": " + groupBy);
      host.innerHTML = chips.join("");
      host.classList.toggle("show", chips.length > 0);
      host.querySelectorAll("button[data-clear]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-clear");
          if (id === "overdue") {
            filterMode = "all";
            document.querySelectorAll("#filterSeg button").forEach((b) => b.classList.toggle("active", b.getAttribute("data-filter") === "all"));
          } else if (id === "keeper") {
            if (!isSelfScoped()) document.getElementById("filterKeeper").value = "";
          } else if (id === "supplier") document.getElementById("filterSupplier").value = "";
          else if (id === "supervisor") document.getElementById("filterSupervisor").value = "";
          else if (id === "minDays") document.getElementById("minDays").value = "0";
          else if (id === "from") document.getElementById("dateFrom").value = "";
          else if (id === "to") document.getElementById("dateTo").value = "";
          else if (id === "groupBy") document.getElementById("groupBy").value = "none";
          syncFilterDot();
          render();
        };
      });
    }

    function toolMatchesKeeper(tool, keeper) {
      if (!keeper) return true;
      const match = keeperMatchSet(keeper);
      if (!match) return true;
      const hit = (raw) => raw && match.has(String(raw));
      if (hit(tool.keeper)) return true;
      if (Array.isArray(tool.keepers) && tool.keepers.some(hit)) return true;
      return (tool.lots || []).some((lot) => hit(lot.keeper || lot.createdBy));
    }

    function openExportModal() {
      const rows = filtered();
      if (!rows.length) return;
      document.getElementById("exportModalHint").textContent =
        `${rows.length} ${t("peopleWithTools").toLowerCase()} · ${t("chooseExportFormat")}`;
      document.getElementById("exportModal").style.display = "block";
    }

    function closeExportModal() {
      document.getElementById("exportModal").style.display = "none";
    }

    function doExport(format) {
      closeExportModal();
      const rows = filtered();
      if (!rows.length) return;
      const label = TCExport.stamp();
      try {
        if (format === "pdf") TCExport.exportOutstandingPdf(rows, label);
        else TCExport.exportOutstandingExcel(rows, label);
      } catch (e) {
        alert(e.message || t("error"));
      }
    }

    function fmtWhen(iso, fallback) {
      if (iso && typeof formatDisplayDateTime === "function") return formatDisplayDateTime(iso);
      if (fallback) return fallback;
      return "—";
    }

    function dayBounds() {
      const fromVal = document.getElementById("dateFrom").value;
      const toVal = document.getElementById("dateTo").value;
      let fromMs = null;
      let toMs = null;
      if (fromVal) {
        const d = new Date(fromVal + "T00:00:00");
        if (!Number.isNaN(d.getTime())) fromMs = d.getTime();
      }
      if (toVal) {
        const d = new Date(toVal + "T23:59:59.999");
        if (!Number.isNaN(d.getTime())) toMs = d.getTime();
      }
      return { fromMs, toMs };
    }

    function toolInRange(tool, fromMs, toMs) {
      if (fromMs == null && toMs == null) return true;
      const ms = tool.takenAt ? new Date(tool.takenAt).getTime() : NaN;
      if (Number.isNaN(ms)) return false;
      if (fromMs != null && ms < fromMs) return false;
      if (toMs != null && ms > toMs) return false;
      return true;
    }

    async function load(opts = {}) {
      const host = document.getElementById("list");
      const silent = !!opts.silent;
      if (!silent) host.innerHTML = `<div class="tc-text-muted text-center py-4">${t("loading")}</div>`;
      try {
        overdueDaysSetting = typeof getOverdueDays === "function" ? getOverdueDays() : 1;
        await loadKeeperDirectory();
        const params = { action: "getOutstanding", overdueDays: overdueDaysSetting };
        // Managers may pass optional keeper filter; store keepers are scoped on the server.
        if (canSeeAllKeepers()) {
          const k = document.getElementById("filterKeeper")?.value || "";
          if (k) params.keeper = k;
        }
        const data = await apiGet(params);
        if (data && data.error) throw new Error(data.error);
        items = (data && data.items) || [];
        if (data && data.overdueDays) overdueDaysSetting = data.overdueDays;
        if (data && data.scope && data.scope.mode) {
          listScope = { mode: data.scope.mode, keeper: data.scope.keeper || "" };
        } else if (isSelfScoped()) {
          listScope = { mode: "self", keeper: myUsername() };
        } else {
          listScope = { mode: "all", keeper: "" };
        }
        refreshFilterOptions();
        applyKeeperScopeUi();
        const stampEl = document.getElementById("lastUpdated");
        if (stampEl) {
          const now = new Date();
          stampEl.textContent = tt("updatedAt", "Updated") + " " + now.toLocaleTimeString();
        }
        render();
      } catch (e) {
        if (!silent) {
          host.innerHTML = `<div class="text-danger text-center py-4">${escHtml(e.message || "Error")}</div>`;
        }
      }
    }

    function filtered() {
      const q = document.getElementById("q").value.trim().toUpperCase();
      const { fromMs, toMs } = dayBounds();
      const keeper = document.getElementById("filterKeeper").value;
      let rows = items.map((p) => {
        let tools = (p.tools || []).filter((tool) => toolInRange(tool, fromMs, toMs));
        tools = tools.filter((tool) => toolMatchesKeeper(tool, keeper));
        if (((fromMs != null || toMs != null) || keeper) && !tools.length) return null;
        const qty = tools.reduce((s, tool) => s + (tool.qty || 1), 0);
        const daysOut = tools.length ? Math.max(...tools.map((tool) => tool.daysOut || 0)) : p.daysOut;
        const keepers = [
          ...new Set(
            tools.flatMap((tool) => {
              const list = [];
              if (tool.keeper) list.push(tool.keeper);
              (tool.keepers || []).forEach((k) => list.push(k));
              (tool.lots || []).forEach((lot) => {
                const k = lot.keeper || lot.createdBy;
                if (k) list.push(k);
              });
              return list;
            })
          ),
        ];
        return {
          ...p,
          tools,
          qty: (fromMs != null || toMs != null || keeper) ? qty : p.qty,
          daysOut,
          overdue: tools.some((tool) => tool.overdue) || ((fromMs == null && toMs == null && !keeper) && p.overdue),
          keeper: keepers[0] || p.keeper || "",
          keepers
        };
      }).filter(Boolean);

      if (filterMode === "overdue") rows = rows.filter((p) => p.overdue);
      const supplier = document.getElementById("filterSupplier").value;
      if (supplier) rows = rows.filter((p) => String(p.supplierName || "") === supplier);
      const supervisor = document.getElementById("filterSupervisor").value;
      if (supervisor) rows = rows.filter((p) => String(p.supervisorName || "") === supervisor);
      const minDays = Number(document.getElementById("minDays").value || 0);
      if (minDays > 0) rows = rows.filter((p) => (p.daysOut || 0) >= minDays);
      if (q) {
        rows = rows.filter((p) => {
          const blob = [
            p.code, p.name, p.phone, p.residenceNo, p.supplierName, p.supervisorName,
            ...(p.keepers || []),
            ...(p.tools || []).map((tool) => tool.code + " " + tool.description + " " + (tool.keeper || ""))
          ].join(" ").toUpperCase();
          return blob.includes(q);
        });
      }
      const sort = document.getElementById("sortBy").value;
      rows.sort((a, b) => {
        if (sort === "qty") return b.qty - a.qty || a.name.localeCompare(b.name);
        if (sort === "name") return a.name.localeCompare(b.name);
        if (sort === "time") {
          const ta = a.lastOutAt ? new Date(a.lastOutAt).getTime() : 0;
          const tb = b.lastOutAt ? new Date(b.lastOutAt).getTime() : 0;
          return tb - ta;
        }
        return b.daysOut - a.daysOut || b.qty - a.qty;
      });
      return rows;
    }

    function updateKpis(rows) {
      const people = rows.length;
      const tools = rows.reduce((s, p) => s + (p.qty || 0), 0);
      const overduePeople = rows.filter((p) => p.overdue).length;
      const maxDays = rows.length ? Math.max(...rows.map((p) => p.daysOut || 0)) : 0;
      document.getElementById("kPeople").textContent = people;
      document.getElementById("kTools").textContent = tools;
      document.getElementById("kOverdue").textContent = overduePeople;
      document.getElementById("kMax").textContent = maxDays;
      document.getElementById("resultCount").textContent =
        t("nrShowingPeople", { n: people }) || `Showing ${people} people`;
      document.getElementById("overdueHint").textContent =
        t("nrOverdueAfter", { n: overdueDaysSetting }) || `Overdue after ${overdueDaysSetting}d`;
      ["btnExport", "btnExportM"].forEach((id) => {
        const btn = document.getElementById(id);
        if (btn) btn.disabled = !rows.length;
      });
    }

    function avatarHtml(p) {
      if (p.imageUrl) {
        return `<img class="nr-avatar" src="${escHtml(p.imageUrl)}" alt="" loading="lazy">`;
      }
      const ini = (typeof initials === "function" ? initials(p.name) : (p.name || "?").slice(0, 2)).toUpperCase();
      return `<div class="nr-avatar">${escHtml(ini)}</div>`;
    }

    function statusBadge(p) {
      if (p.overdue) {
        return `<span class="nr-badge hot"><i class="bi bi-exclamation-triangle-fill"></i> ${escHtml(t("overdueHolding", { n: p.daysOut }) || `Overdue · ${p.daysOut}d`)}</span>`;
      }
      return `<span class="nr-badge"><i class="bi bi-hourglass-split"></i> ${p.daysOut}d ${escHtml(t("nrOut") || "out")}</span>`;
    }

    function toolRowsHtml(tools) {
      if (!tools.length) {
        return `<div class="tc-text-muted small px-2 py-2">${escHtml(t("noRows"))}</div>`;
      }
      return tools.map((tool) => {
        const when = fmtWhen(tool.takenAt, tool.takenDateTime || tool.takenDate);
        const desc = tool.description && tool.description !== tool.code ? tool.description : "";
        const qty = tool.qty > 1 ? `×${tool.qty}` : "";
        const thumb = typeof productThumbHtml === "function"
          ? productThumbHtml(tool.imageUrl, tool.code, 52)
          : "";
        const lots = Array.isArray(tool.lots) ? tool.lots : [];
        const showLots = (tool.qty || 1) > 1 && lots.length > 1;
        const lotsHtml = showLots
          ? `<div class="nr-tool-lots">${lots.map((lot) => {
              const lotWhen = fmtWhen(lot.takenAt, lot.takenDateTime || lot.takenDate);
              return `<div class="nr-tool-lot${lot.overdue ? " hot" : ""}"><i class="bi bi-clock"></i> ${escHtml(lotWhen)} · <strong>${lot.daysOut}d</strong></div>`;
            }).join("")}</div>`
          : `<span><i class="bi bi-box-arrow-right"></i> <strong>${escHtml(t("nrIssuedOn") || "Issued")}:</strong>&nbsp;${escHtml(when)}</span>`;
        const keeper = tool.keeper || (tool.keepers && tool.keepers[0]) || "";
        const keeperHtml = keeper
          ? `<span><i class="bi bi-person-workspace"></i> <strong>${escHtml(t("storeKeeper") || "Keeper")}:</strong>&nbsp;${escHtml(keeper)}</span>`
          : "";
        return `<div class="nr-tool ${tool.overdue ? "hot" : ""}">
          ${thumb}
          <div>
            <a class="nr-tool-code" href="tool.html?code=${encodeURIComponent(tool.code)}">${escHtml(tool.code)}${qty ? " " + qty : ""}</a>
            <div class="nr-tool-name">${escHtml(desc || tool.code)}</div>
          </div>
          <div class="nr-tool-days">${tool.daysOut}d</div>
          <div class="nr-tool-meta">
            ${lotsHtml}
            ${keeperHtml}
            ${tool.overdue && !showLots ? `<span style="color:var(--tc-danger);font-weight:800"><i class="bi bi-flag-fill"></i> ${escHtml(t("nrToolOverdue") || "Overdue")}</span>` : ""}
          </div>
        </div>`;
      }).join("");
    }

    function personCardHtml(p) {
      const lastWhen = fmtWhen(p.lastOutAt, p.lastOutDateTime || p.lastOutDate);
      const tools = p.tools || [];
      const href = `worker.html?code=${encodeURIComponent(p.code)}`;
      const chips = [];
      if (p.supplierName) chips.push(`<span class="nr-chip sup"><i class="bi bi-truck"></i> ${escHtml(p.supplierName)}</span>`);
      if (p.supervisorName) chips.push(`<span class="nr-chip sv"><i class="bi bi-person-badge"></i> ${escHtml(p.supervisorName)}</span>`);
      const keeperLabel = (p.keepers && p.keepers.length > 1)
        ? p.keepers.join(", ")
        : (p.keeper || (p.keepers && p.keepers[0]) || "");
      if (keeperLabel) chips.push(`<span class="nr-chip keeper"><i class="bi bi-person-workspace"></i> ${escHtml(keeperLabel)}</span>`);
      return `<article class="nr-card ${p.overdue ? "overdue" : ""}">
        <a class="nr-card-head" href="${href}">
          ${avatarHtml(p)}
          <div>
            <div class="nr-name">${escHtml(p.name)}</div>
            <div class="nr-code">${escHtml(p.code)}</div>
            ${chips.length ? `<div class="nr-chip-row">${chips.join("")}</div>` : ""}
          </div>
          <div class="nr-status">
            ${statusBadge(p)}
            <div class="nr-qty-pill">${p.qty} ${escHtml(t("toolsHeldShort") || "tools")}</div>
          </div>
        </a>
        <div class="nr-info">
          <div class="nr-info-row"><i class="bi bi-clock-history"></i><span><strong>${escHtml(t("lastOut") || "Last OUT")}:</strong>&nbsp;${escHtml(lastWhen)}</span></div>
          ${p.phone ? `<div class="nr-info-row"><i class="bi bi-telephone"></i><span><strong>${escHtml(t("phone") || "Phone")}:</strong>&nbsp;<a href="tel:${escHtml(p.phone)}">${escHtml(p.phone)}</a></span></div>` : ""}
          ${p.residenceNo ? `<div class="nr-info-row"><i class="bi bi-person-vcard"></i><span><strong>${escHtml(t("residenceNo") || "Residence")}:</strong>&nbsp;${escHtml(p.residenceNo)}</span></div>` : ""}
          ${p.supplierName ? `<div class="nr-info-row"><i class="bi bi-truck"></i><span><strong>${escHtml(t("supplier") || "Supplier")}:</strong>&nbsp;${escHtml(p.supplierName)}</span></div>` : ""}
          ${p.supervisorName ? `<div class="nr-info-row"><i class="bi bi-person-badge"></i><span><strong>${escHtml(t("supervisor") || "Supervisor")}:</strong>&nbsp;${escHtml(p.supervisorName)}</span></div>` : ""}
        </div>
        <div class="nr-tools-head">
          <span>${escHtml(t("currentlyHeld") || "Currently held")}</span>
          <span>${tools.length} ${escHtml(t("nrLineItems") || "line(s)")}</span>
        </div>
        <div class="nr-tools-body${tools.length > 1 ? " multi" : ""}">${toolRowsHtml(tools)}</div>
        <div class="nr-card-foot">
          <span class="hint">${escHtml(t("nrTapForHistory") || "Full custody history")}</span>
          <a class="tc-btn tc-btn-primary" href="${href}">
            ${escHtml(t("viewReport") || "View report")} <i class="bi bi-chevron-right"></i>
          </a>
        </div>
      </article>`;
    }

    function groupedHtml(rows) {
      const mode = document.getElementById("groupBy").value || "none";
      if (mode === "none") return rows.map(personCardHtml).join("");
      const keyOf = (p) => {
        if (mode === "supervisor") return p.supervisorName || (t("unassigned") || "Unassigned");
        if (mode === "keeper") {
          if (p.keepers && p.keepers.length) return p.keepers.join(", ");
          return p.keeper || (t("unassigned") || "Unassigned");
        }
        return p.supplierName || (t("unassigned") || "Unassigned");
      };
      const icon = mode === "supervisor"
        ? "bi-person-badge"
        : mode === "keeper"
          ? "bi-person-workspace"
          : "bi-truck";
      const groups = new Map();
      rows.forEach((p) => {
        const k = keyOf(p);
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(p);
      });
      return [...groups.entries()].map(([label, people]) => {
        const qty = people.reduce((s, p) => s + (p.qty || 0), 0);
        return `<section class="nr-group">
          <div class="nr-group-head">
            <strong><i class="bi ${icon}"></i> ${escHtml(label)}</strong>
            <span class="nr-group-badge">${people.length} · ${qty} ${escHtml(t("toolsShort") || "tools")}</span>
          </div>
          <div class="nr-list">${people.map(personCardHtml).join("")}</div>
        </section>`;
      }).join("");
    }

    function render() {
      const host = document.getElementById("list");
      const rows = filtered();
      updateKpis(rows);
      syncFilterDot();
      renderActiveChips();
      if (!items.length) {
        host.innerHTML = `<div class="nr-empty"><i class="bi bi-check-circle"></i><strong>${t("allReturnedTitle") || "All clear"}</strong><div class="tc-text-muted mt-1">${t("allReturnedHint") || "Every tool has been returned."}</div></div>`;
        return;
      }
      if (!rows.length) {
        host.innerHTML = `<div class="nr-empty"><i class="bi bi-search" style="color:var(--tc-muted)"></i>${t("noRows") || "No matches"}</div>`;
        return;
      }
      host.innerHTML = groupedHtml(rows);
    }
  </script>
</body>
</html>
