<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolCustody | Not returned</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a5f">
  <script src="config.js"></script>
  <script src="ui.js"></script>
  <script src="parser.js"></script>
</head>
<body class="tc-page">
  <div class="tc-wrap">
    <div class="tc-shell">
      <div id="app-header"></div>
      <div class="tc-card">
        <span class="tc-section-badge"><i class="bi bi-person-exclamation"></i> مين ما رجّع العدة</span>
        <p class="tc-text-muted small mt-2">عمال معهم أدوات لسه برّا المخزن</p>
        <div id="list" class="mt-3">Loading…</div>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => TCUI.bootPage(() => {
      TCUI.mountHeader("app-header", {
        active: "outstanding",
        title: "Not returned",
        subtitle: "Who still has tools out",
        icon: "bi-person-exclamation",
        toolbar: `<button class="tc-btn tc-btn-primary" id="btnRefresh"><i class="bi bi-arrow-clockwise"></i> Refresh</button>`
      });
      document.getElementById("btnRefresh").onclick = load;
      load();
    }, { pageId: "outstanding" }));

    async function load() {
      const host = document.getElementById("list");
      try {
        const dates = await apiGet({ action: "getDates" });
        const day = Array.isArray(dates) && dates.length ? dates[dates.length - 1] : "";
        const rows = day ? await apiGet({ action: "getData", date: day }) : [];
        if (rows && rows.error) throw new Error(rows.error);
        const list = CustodyParser.buildOutstanding(Array.isArray(rows) ? rows : []);
        if (!list.length) {
          host.innerHTML = `<div class="tc-alert ok"><i class="bi bi-check-circle"></i><span>كل العدة راجعة — All tools returned</span></div>`;
          return;
        }
        host.innerHTML = list.map(p => `
          <div class="tc-card mb-3" style="padding:1rem">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
              <strong>${escHtml(p.person)}</strong>
              <span class="badge bg-danger">${p.qty} tool(s)</span>
            </div>
            <ul class="mb-0 mt-2 small">${p.tools.map(t =>
              `<li><a href="tool.html?code=${encodeURIComponent(t.code)}">${escHtml(t.code)}</a> — ${escHtml(t.description)} ×${t.qty}</li>`
            ).join("")}</ul>
          </div>`).join("");
      } catch (e) {
        host.innerHTML = `<div class="text-danger">${escHtml(e.message || "Error")}</div>`;
      }
    }
  </script>
</body>
</html>
