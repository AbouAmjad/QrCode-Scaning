<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolCustody | Not returned</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a5f">
  <script src="config.js"></script>
  <script src="i18n.js?v=26"></script>
  <script src="ui.js"></script>
  <script src="parser.js"></script>
  <style>
    .nr-keeper-block { margin-bottom: 1.25rem; }
    .nr-keeper-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      margin-bottom: .55rem;
      padding-bottom: .35rem;
      border-bottom: 1px solid var(--tc-border, #e2e8f0);
    }
    .nr-keeper-head strong { font-size: .95rem; }
    .nr-keeper-badge {
      font-size: .72rem;
      font-weight: 700;
      padding: .2rem .55rem;
      border-radius: 999px;
      background: color-mix(in srgb, var(--tc-accent, #0d9488) 14%, transparent);
      color: var(--tc-accent-2, var(--tc-accent, #0f766e));
    }
    .nr-scope-note {
      font-size: .8rem;
      color: var(--tc-muted, #64748b);
      margin: 0 0 .75rem;
    }
  </style>
</head>
<body class="tc-page">
  <div class="tc-wrap">
    <div class="tc-shell">
      <div id="app-header"></div>
      <div class="tc-card">
        <span class="tc-section-badge"><i class="bi bi-person-exclamation"></i> <span id="nrTitle">Not returned</span></span>
        <p class="tc-text-muted small mt-2" id="nrSubtitle">Tools still out with workers</p>
        <p class="nr-scope-note" id="nrScope" hidden></p>
        <div id="list" class="mt-3">Loading…</div>
      </div>
    </div>
  </div>
  <script>
    function nrT(key, fallback) {
      if (typeof TCI18N !== "undefined" && TCI18N.t) {
        const v = TCI18N.t(key);
        if (v && v !== key) return v;
      }
      return fallback || key;
    }

    function renderPersonCard(p) {
      return `
        <div class="tc-card mb-3" style="padding:1rem">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <strong>${escHtml(p.person)}</strong>
            <span class="badge bg-danger">${p.qty} ${nrT("toolsShort", "tool(s)")}</span>
          </div>
          <ul class="mb-0 mt-2 small">${p.tools.map(t =>
            `<li><a href="tool.html?code=${encodeURIComponent(t.code)}">${escHtml(t.code)}</a> — ${escHtml(t.description)} ×${t.qty}</li>`
          ).join("")}</ul>
        </div>`;
    }

    document.addEventListener("DOMContentLoaded", () => TCUI.bootPage(() => {
      const isAdmin = typeof getRole === "function" && getRole() === "admin";
      const user = typeof getSessionUser === "function" ? getSessionUser() : "";
      const subtitle = document.getElementById("nrSubtitle");
      const scope = document.getElementById("nrScope");

      TCUI.mountHeader("app-header", {
        active: "outstanding",
        title: nrT("outstanding", "Not returned"),
        subtitle: isAdmin
          ? nrT("outstandingAdminSub", "All store keepers — every tool still out")
          : nrT("outstandingKeeperSub", "Only tools you checked out"),
        icon: "bi-person-exclamation",
        toolbar: `<button class="tc-btn tc-btn-primary" id="btnRefresh"><i class="bi bi-arrow-clockwise"></i> ${nrT("refresh", "Refresh")}</button>`
      });

      if (subtitle) {
        subtitle.textContent = isAdmin
          ? nrT("outstandingAdminSub", "All store keepers — every tool still out")
          : nrT("outstandingKeeperSub", "Only tools you checked out");
      }
      if (scope && !isAdmin && user) {
        scope.hidden = false;
        scope.textContent = nrT("outstandingKeeperScope", "Showing your checkouts only") + ` · ${user}`;
      }

      document.getElementById("btnRefresh").onclick = load;
      load();
    }, { pageId: "outstanding" }));

    async function load() {
      const host = document.getElementById("list");
      const isAdmin = typeof getRole === "function" && getRole() === "admin";
      const user = typeof getSessionUser === "function" ? getSessionUser() : "";
      try {
        const dates = await apiGet({ action: "getDates" });
        const day = Array.isArray(dates) && dates.length ? dates[dates.length - 1] : "";
        const rows = day ? await apiGet({ action: "getData", date: day }) : [];
        if (rows && rows.error) throw new Error(rows.error);

        const opts = isAdmin
          ? { allKeepers: true }
          : { keeper: user };
        const list = CustodyParser.buildOutstanding(Array.isArray(rows) ? rows : [], opts);

        if (!list.length) {
          host.innerHTML = `<div class="tc-alert ok"><i class="bi bi-check-circle"></i><span>${escHtml(
            isAdmin
              ? nrT("outstandingAllClear", "All tools returned — every store keeper")
              : nrT("outstandingMyClear", "No tools waiting on your shift — all returned")
          )}</span></div>`;
          return;
        }

        if (isAdmin) {
          const byKeeper = CustodyParser.groupOutstandingByKeeper(list);
          host.innerHTML = byKeeper.map(block => {
            const keeperLabel = block.keeper
              ? block.keeper
              : nrT("outstandingUnassigned", "Unassigned (legacy scans)");
            return `
              <section class="nr-keeper-block">
                <div class="nr-keeper-head">
                  <strong><i class="bi bi-person-badge me-1"></i>${escHtml(keeperLabel)}</strong>
                  <span class="nr-keeper-badge">${block.qty} ${nrT("toolsShort", "tool(s)")}</span>
                </div>
                ${block.people.map(renderPersonCard).join("")}
              </section>`;
          }).join("");
          return;
        }

        host.innerHTML = list.map(renderPersonCard).join("");
      } catch (e) {
        host.innerHTML = `<div class="text-danger">${escHtml(e.message || "Error")}</div>`;
      }
    }
  </script>
</body>
</html>
